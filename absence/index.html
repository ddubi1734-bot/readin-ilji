<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>결석·보강 캘린더 | 리드인</title>
<meta name="theme-color" content="#176b5b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='8' width='56' height='52' rx='12' fill='%23176b5b'/%3E%3Crect x='4' y='8' width='56' height='16' rx='8' fill='%230f5446'/%3E%3Crect x='16' y='3' width='6' height='12' rx='3' fill='%23fff'/%3E%3Crect x='42' y='3' width='6' height='12' rx='3' fill='%23fff'/%3E%3Cpath d='M22 40l7 7 14-15' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{--ink:#182b2a;--muted:#6b7c79;--green:#176b5b;--mint:#e6f3ee;--line:#e4ebe7;--paper:#f5f8f6;--red:#a33f3f;--amber:#94620b;--blue:#2f5fb3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;font-size:14px}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.55;cursor:default}
.hidden{display:none!important}
.top{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:30}
.brand{display:flex;gap:11px;align-items:center;cursor:pointer}
.brand h1{font-size:17px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:2px 0 0}
.logo{width:40px;height:40px;border-radius:11px;display:block;box-shadow:0 3px 10px #0f544633}
.topright{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ghost{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-size:12px;color:#536560;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.ghost:hover{border-color:#c5d5cd}
.primary{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:800}
.outline{border:1px solid var(--green);background:#fff;color:var(--green);font-weight:750;border-radius:9px;padding:7px 11px;font-size:12px}
.danger{border:1px solid #e7caca;background:#fff;color:var(--red);font-weight:700;border-radius:9px;padding:7px 11px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 20px #1b44330a}
.loginwrap{min-height:calc(100vh - 63px);display:grid;place-items:center;padding:20px}
.login{width:min(380px,100%);padding:28px}.login h2{margin:0 0 6px}.login p{color:var(--muted);font-size:13px;margin:0 0 14px}
.login .inp{width:100%;padding:11px 12px;font-size:15px}.login .primary{width:100%;margin-top:12px;padding:12px}
.inp{border:1px solid #dce5e0;border-radius:8px;padding:7px 9px;outline:none;background:#fff;min-width:0}
.inp:focus,.search:focus{border-color:var(--green);box-shadow:0 0 0 3px #176b5b1a}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#183c34;color:#fff;padding:11px 17px;border-radius:10px;box-shadow:0 6px 22px #102a241f;opacity:0;pointer-events:none;transition:.2s;font-size:13px;z-index:90;max-width:90vw;text-align:center}
.toast.show{opacity:1}.toast.bad{background:#8a2f2f}
.loading{padding:50px 20px;text-align:center;color:var(--muted)}
.search{border:1px solid #dce5e0;border-radius:10px;padding:9px 12px;outline:none;min-width:0;background:#fff}
.chip{border:1px solid #dce5e0;background:#fff;border-radius:99px;padding:5px 11px;font-size:12px;color:#536560;white-space:nowrap}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.chip b{font-weight:800}
/* nav */
.nav{display:flex;gap:4px;padding:10px 22px 0;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:61px;z-index:25}
.nav button{border:0;background:none;padding:9px 13px 11px;font-weight:700;color:#5f716d;border-bottom:3px solid transparent;white-space:nowrap;font-size:13.5px}
.nav button.on{color:var(--green);border-bottom-color:var(--green)}
.nav .cnt{font-size:11px;background:#eef3f0;color:#5f716d;border-radius:99px;padding:1px 7px;margin-left:5px;font-weight:800}
.nav button.on .cnt{background:var(--mint);color:var(--green)}
.nav .sp{flex:1}
.nav .addbtn2{align-self:center;margin:0 6px 6px 0;padding:7px 12px;font-size:13px;border:1px solid var(--green);color:var(--green);border-radius:10px;font-weight:800;background:#fff}
.nav .addbtn{align-self:center;margin-bottom:6px;padding:8px 14px;font-size:13px;background:var(--green);color:#fff;border-radius:10px;border:0;font-weight:800}
.main{padding:18px 22px 90px;max-width:1280px;margin:0 auto}
/* sync pill */
.sync{font-size:11.5px;border-radius:99px;padding:4px 10px;background:#eef6f1;color:#3d6e5f;font-weight:700;border:0}
.sync.warn{background:#fff1e0;color:#b45d12}
/* status pills */
.pill{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}
.st-wait{background:#fff4e0;color:#94620b}.st-booked{background:#e7effc;color:#2f5fb3}.st-check{background:#f3e8fb;color:#7a3fa3}
.st-done{background:#e3f4ea;color:#1d7a4a}.st-closed{background:#eef1ef;color:#6b7c79}.st-expired{background:#fbeaea;color:#a33f3f}.st-nodate{background:#eef1ef;color:#6b7c79}
.dd{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;white-space:nowrap;background:#f1f4f2;color:#6b7c79}
.dd.soon{background:#fff1e0;color:#b45d12}.dd.subj{background:#fdf0e6;color:#b45d12}.dd.subj.s-t{background:#e9f1fb;color:#2f5fb3}
.dd.part{background:#e7effc;color:#2f5fb3}.dd.urgent{background:#fbeaea;color:#a33f3f}
/* home */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{padding:14px 16px;cursor:pointer}.stat .l{font-size:12px;color:var(--muted);font-weight:700}.stat .v{font-size:24px;font-weight:850;margin-top:4px}.stat .s{font-size:12px;color:var(--muted);margin-top:2px}
.stat.red .v{color:var(--red)}.stat.blue .v{color:var(--blue)}.stat.purple .v{color:#7a3fa3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sec{padding:14px 16px;margin-bottom:14px}
.sec h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}.sec h3 .n{font-size:12px;color:var(--muted);font-weight:700}
.sec .hint{font-size:12px;color:var(--muted);margin:0 0 8px}
.empty{color:#94a39f;font-size:13px;padding:14px 4px}
/* list rows */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:9px;padding:9px 6px;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}
.row:hover{background:#fafcfb}
.row .nm{font-weight:800;min-width:66px;cursor:pointer}.row .nm:hover{text-decoration:underline}
.row .dt{min-width:84px;color:#33433f;cursor:pointer}
.row .mn{min-width:48px;color:#33433f;font-weight:700}
.row .memo{color:var(--muted);font-size:12.5px;flex:1;min-width:60px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:flex;gap:5px;margin-left:auto}
.row .acts button{font-size:12px;padding:5px 9px;border-radius:8px}
.mini{border:1px solid var(--line);background:#fff;color:#536560}
.mini.g{border-color:#bfe0cd;color:#1d7a4a;font-weight:750}.mini.b{border-color:#c6d6f2;color:var(--blue);font-weight:750}
.cbx{width:18px;height:18px;accent-color:var(--green);cursor:pointer;flex:none}
.grp{margin-bottom:12px;padding:4px 12px 6px}
.grp .gh{display:flex;align-items:center;gap:9px;padding:9px 6px;flex-wrap:wrap}
.grp .gh .gn{font-weight:850;font-size:15px;cursor:pointer}.grp .gh .gn:hover{text-decoration:underline}
.grp .gh .gs{font-size:12px;color:var(--muted)}
.grp .gh .tot{margin-left:auto;font-weight:800;color:var(--amber);font-size:13px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .search{width:220px}
.toolbar .sp{flex:1}
.sum{font-size:12.5px;color:var(--muted)}
.sum b{color:var(--ink)}
.bulk{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#183c34;color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px #102a2440;z-index:50;font-size:13px;flex-wrap:wrap;max-width:94vw}
.bulk button{border:0;border-radius:9px;padding:7px 12px;font-weight:800;font-size:12.5px}
.bulk .w{background:#fff;color:#183c34}.bulk .x{background:transparent;color:#cfe3d8}
.banner{background:#fff8ec;border:1px solid #f1dfbd;color:#7a5512;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* calendar */
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.calhead h2{margin:0 6px 0 0;font-size:20px}
.calhead .search{width:180px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal .wd{padding:8px;font-size:12px;font-weight:800;color:var(--muted);text-align:left;border-bottom:1px solid var(--line);background:#fbfcfb}
.cal .wd.sun{color:#c0504d}.cal .wd.sat{color:#3f6fb5}
.cell{min-height:96px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 5px 8px;cursor:pointer;position:relative}
.cell:nth-child(7n){border-right:0}
.cell:hover{background:#fafcfb}
.cell.out{background:#fafbfa}.cell.out .dn{color:#b8c3bf}
.cell .dn{font-size:12px;font-weight:800;color:#536560;display:flex;justify-content:space-between;align-items:center;padding:1px 3px 4px}
.cell .dn .ds{font-size:10.5px;color:var(--muted);font-weight:700}
.cell.today .dn>span:first-child{background:#e5553b;color:#fff;border-radius:99px;padding:1px 7px}
.cell.sun .dn>span:first-child{color:#c0504d}.cell.today.sun .dn>span:first-child{color:#fff}
.ev{display:flex;align-items:center;gap:4px;font-size:12px;border-radius:7px;padding:3px 6px;margin-bottom:3px;cursor:pointer;line-height:1.25;border:1px solid transparent}
.ev .en{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .em{font-size:11px;opacity:.85;margin-left:auto;white-space:nowrap}
.ev.st-wait{background:#fff4e0}.ev.st-booked{background:#e7effc}.ev.st-check{background:#f3e8fb}.ev.st-done{background:#e3f4ea}.ev.st-closed{background:#eef1ef}.ev.st-expired{background:#fbeaea}
.ev.mk{background:#fff;border:1.5px dashed #9fb7e3;color:var(--blue)}
.ev.mk.done{border-color:#a8d5ba;color:#1d7a4a}.ev .tg,.legend .tg{flex:none;font-size:10.5px;font-weight:800;border-radius:5px;padding:1px 5px;background:#2f5fb3;color:#fff;margin-right:2px;line-height:1.4}
.ev.mk.done .tg,.legend .pill[style*='a8d5ba'] .tg{background:#1d7a4a}.ev.mk.late .tg{background:#7a3fa3}
.ev.mk.late{border-color:#c9a6e0;color:#7a3fa3}
.ev.dim{opacity:.18}
.ln{display:flex;align-items:flex-start;gap:4px;font-size:11.5px;line-height:1.35;border-radius:6px;padding:2px 4px;margin-bottom:2px}
.ln .tg{flex:none;font-size:10px;font-weight:800;border-radius:4px;padding:0 4px;color:#fff;background:#94620b;line-height:1.5}
.ln .nms{display:flex;flex-wrap:wrap;gap:0 6px;min-width:0}
.nmi{font-weight:750;cursor:pointer;white-space:nowrap}.nmi:hover{text-decoration:underline}.nmi em{font-style:normal;font-weight:600;opacity:.75;margin-left:2px;font-size:10.5px}.nmi.dim{opacity:.18}
.ln.st-wait{background:#fff4e0;color:#7a5512}.ln.st-booked{background:#e7effc;color:#2f5fb3}.ln.st-booked .tg{background:#2f5fb3}.ln.st-check{background:#f3e8fb;color:#7a3fa3}.ln.st-check .tg{background:#7a3fa3}
.ln.st-done,.ln.st-closed{background:#eef6f1;color:#1d7a4a}.ln.st-done .tg,.ln.st-closed .tg{background:#1d7a4a}.ln.st-expired{background:#fbeaea;color:#a33f3f}.ln.st-expired .tg{background:#a33f3f}
.ln.sh .tg{background:#c27c0e}.ln.sh{background:#fffaf0;border:1px dashed #f0d6a8}
.ln.bk{background:#fff;border:1.5px dashed #9fb7e3;color:#2f5fb3}.ln.bk .tg{background:#2f5fb3}.ln.bk.late{border-color:#c9a6e0;color:#7a3fa3}.ln.bk.late .tg{background:#7a3fa3}
.ln.mk{background:#fff;border:1.5px dashed #a8d5ba;color:#1d7a4a}.ln.mk .tg{background:#1d7a4a}
.legend .ln.lg{margin:0;font-size:11.5px}
.daybtn{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;border-radius:14px;padding:16px;border:1.5px solid var(--line);background:#fff;cursor:pointer}.daybtn b{font-size:16px}.daybtn span{font-size:12.5px;color:var(--muted)}
.daybtn.ab{border-color:#e7c88f;background:#fffaf0}.daybtn.ab b{color:#94620b}.daybtn.mk{border-color:#a8d5ba;background:#f3faf6}.daybtn.mk b{color:#1d7a4a}.daybtn:hover{box-shadow:0 4px 14px #1b443315}
.calnav{display:flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.calnav h2{margin:0 8px;font-size:19px;min-width:128px;text-align:center}
.calnav .nb{border:0;background:none;width:34px;height:34px;border-radius:9px;font-size:22px;line-height:1;color:#536560}.calnav .nb:hover{background:#eef3f0}
.viewbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:10px}
.vgroup{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1}
.vlabel{font-size:12px;font-weight:800;color:var(--muted);margin-right:2px}
.vt{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #e3e9e6;background:#f7f9f8;border-radius:10px;padding:6px 11px;font-size:13px;font-weight:700;color:#8a9a95}
.vt b{font-weight:800;font-size:12px;background:#eef1ef;border-radius:99px;padding:0 7px;color:#8a9a95}
.vt .sw{width:10px;height:10px;border-radius:3px;border:2px solid #b8c3bf;background:#fff}
.vt.on{background:#fff;color:var(--ink)}.vt.on b{color:#fff}
.vt.v-ab.on{border-color:#e7c88f}.vt.v-ab.on .sw{background:#94620b;border-color:#94620b}.vt.v-ab.on b{background:#94620b}
.vt.v-sh.on{border-color:#f0d6a8}.vt.v-sh.on .sw{background:#c27c0e;border-color:#c27c0e}.vt.v-sh.on b{background:#c27c0e}
.vt.v-bk.on{border-color:#9fb7e3}.vt.v-bk.on .sw{background:#2f5fb3;border-color:#2f5fb3}.vt.v-bk.on b{background:#2f5fb3}
.vt.v-mk.on{border-color:#a8d5ba}.vt.v-mk.on .sw{background:#1d7a4a;border-color:#1d7a4a}.vt.v-mk.on b{background:#1d7a4a}
.vswitch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;font-size:12.5px;font-weight:700;color:#6b7c79;padding:4px 6px;border-left:1px solid var(--line);padding-left:14px}
.vswitch .knob{width:32px;height:18px;border-radius:99px;background:#d5ddd9;position:relative;transition:.15s;flex:none}
.vswitch .knob::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.15s}
.vswitch.on{color:var(--green)}.vswitch.on .knob{background:var(--green)}.vswitch.on .knob::after{left:16px}
.mstat{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;font-size:12.5px;color:var(--muted)}
.mstat>span:first-child{font-weight:800;color:var(--ink);margin-right:2px}
.mstat .ms{background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 10px}.mstat .ms b{color:var(--ink)}
.mstat .hint{margin-left:auto;font-size:12px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;align-items:center}
.legend .pill{font-size:11px}
/* table */
table.t{width:100%;border-collapse:collapse;background:#fff}
table.t th{font-size:12px;color:var(--muted);text-align:left;font-weight:800;padding:9px 10px;border-bottom:1px solid var(--line);background:#fbfcfb;position:sticky;top:0;cursor:pointer;white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px}
table.t tr:hover td{background:#fafcfb}
table.t .num{text-align:right;font-variant-numeric:tabular-nums}
.tw{border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:calc(100vh - 230px);background:#fff}
/* stats */
.bars{display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 4px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar .b{width:100%;max-width:42px;background:linear-gradient(#2d8c77,#176b5b);border-radius:6px 6px 2px 2px;min-height:2px;position:relative}
.bar .b .dn{position:absolute;bottom:0;left:0;right:0;background:#9fd3bd;border-radius:0 0 2px 2px}
.bar .v{font-size:11px;font-weight:800;color:#33433f}
.bar .l{font-size:11px;color:var(--muted);white-space:nowrap}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.hbar .k{width:70px;font-weight:750;cursor:pointer}.hbar .track{flex:1;background:#f0f4f2;border-radius:6px;height:14px;overflow:hidden}
.hbar .fill{height:100%;background:#2d8c77;border-radius:6px}.hbar .v{width:90px;text-align:right;color:var(--muted);font-size:12px}
/* modal */
.mback{position:fixed;inset:0;background:#0d1f1b66;display:flex;align-items:flex-start;justify-content:center;z-index:70;padding:5vh 14px;overflow:auto}
.modal{background:#fff;width:min(540px,100%);padding:22px;border-radius:16px;box-shadow:0 20px 60px #0d1f1b40}
.modal.wide{width:min(820px,100%)}
.modal h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px}
.modal .sub{color:var(--muted);font-size:12.5px;margin-bottom:14px}
.field{margin-bottom:13px}.field>label{display:block;font-size:12px;font-weight:800;color:#536560;margin-bottom:5px}
.field .inp{width:100%;padding:9px 11px}
.hrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hrow .inp{width:auto;flex:1}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{border:1px solid #dce5e0;background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;color:#536560}
.seg button.on{background:var(--green);border-color:var(--green);color:#fff}
.seg.small button{padding:5px 9px;font-size:12px}
.mfoot{display:flex;gap:8px;align-items:center;margin-top:16px;flex-wrap:wrap}.mfoot .sp{flex:1}
.info{background:#f6f9f7;border-radius:10px;padding:9px 12px;font-size:12.5px;color:#43534f;line-height:1.7;margin-bottom:12px}
.hist{font-size:12px;color:var(--muted);margin-top:10px;max-height:150px;overflow:auto;border-top:1px solid var(--line);padding-top:8px}
.hist div{padding:2px 0}
.am-list{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.am-item{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 10px;flex-wrap:wrap}
.am-item .n{font-weight:800;min-width:70px}.am-item .inp{width:70px;text-align:right}
.am-item .x{border:0;background:none;color:#8a9a95;font-size:18px;margin-left:auto}
.am-item.dup{border-color:#f1c9c9;background:#fdf6f6}.am-item .warn{color:var(--red);font-size:12px;font-weight:700}
.sug{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;min-height:4px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:5px;margin-top:8px;max-height:230px;overflow:auto;padding:2px}

<script>
'use strict';
const APP_VER='2026-11-15-24';
const SB_URL='https://jkazixakznyhixfnrtvj.supabase.co';
const SB_KEY='sb_publishable_oK4SXAlM-Wm7SkNhVmJfUA_ZKNBn0La';
const TOKEN_KEY='ilji.token.v1', PREF_KEY='absence.pref.v1';
const ST_LIST=['시작 전','예약 중','완료','종료'];
const ERR={BADLOGIN:'비밀번호가 맞지 않아요.',NETWORK:'인터넷 연결을 확인해 주세요.',AUTH:'로그인이 끝났어요. 다시 로그인해 주세요.',DUP:'같은 날 같은 학생의 결석 기록이 이미 있어요.',EMPTYNAME:'학생 이름을 적어 주세요.',EMPTYDAY:'결석 날짜를 골라 주세요.',NORECORD:'이미 지워진 기록이에요. 새로고침해 주세요.',BADVALUE:'값이 올바르지 않아요.'};
const DOW='일월화수목금토';
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(t,bad){const el=$('toast');el.textContent=t;el.classList.toggle('bad',!!bad);el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),bad?4200:2400)}
function errText(e){const m=String(e&&e.message||e);if(/^NOTION/.test(m))return '노션에 반영하지 못했어요. 잠시 뒤 다시 해 주세요.';return ERR[m]||('문제가 생겼어요: '+m)}
async function api(fn,args){
  let r;try{r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args||{})})}catch(e){throw new Error('NETWORK')}
  const t=await r.text();
  if(!r.ok){let m='ERROR';try{m=JSON.parse(t).message||m}catch(_){}if(m==='AUTH'){logout(true)}throw new Error(m)}
  return t?JSON.parse(t):null;
}
/* ---------- 날짜 ---------- */
function today(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10)}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d))}
function fd(t){return t.toISOString().slice(0,10)}
function addDays(s,n){const t=pd(s);t.setUTCDate(t.getUTCDate()+n);return fd(t)}
function addMonths(s,n){const [y,m,d]=s.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return fd(t)}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function dow(s){return DOW[pd(s).getUTCDay()]}
function md(s){if(!s)return '';const t=pd(s);return (t.getUTCMonth()+1)+'/'+t.getUTCDate()}
function mdw(s){if(!s)return '';return md(s)+'('+dow(s)+')'}
function ymd(s){if(!s)return '';const t=pd(s);const y=t.getUTCFullYear(),cy=+today().slice(0,4);return (y!==cy?String(y).slice(2)+'/':'')+mdw(s)}
function kdate(s){const t=pd(s);return `${t.getUTCMonth()+1}월 ${t.getUTCDate()}일(${dow(s)})`}
function mins(n){if(n==null||n==='')return '-';n=+n;if(n<60)return n+'분';const h=Math.floor(n/60),m=n%60;return h+'시간'+(m?' '+m+'분':'')}
function rel(iso){if(!iso)return '';const s=(Date.now()-new Date(iso).getTime())/1000;if(s<60)return '방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';return Math.floor(s/86400)+'일 전'}
/* ---------- 초성 검색 ---------- */
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
function cho(s){return [...s].map(c=>{const k=c.charCodeAt(0)-0xAC00;return k>=0&&k<11172?CHO[Math.floor(k/588)]:c}).join('')}
function match(name,q){if(!q)return true;q=q.replace(/\s/g,'');const n=String(name||'').replace(/\s/g,'');return n.includes(q)||cho(n).includes(q)}
function shortGrade(g){if(!g)return '';return String(g).replace('초등학교 ','초').replace('중학교 ','중').replace('고등학교 ','고').replace('학년','')}

/* ---------- 상태 ---------- */
const S={token:ls.get(TOKEN_KEY),rows:[],allocs:[],students:[],stuMap:new Map(),set:{expireMonths:2},pending:0,pulledAt:null,
  tab:'home',pt:'all',calY:0,calM:0,calQ:'',showMk:true,pq:'',pf:'all',pg:true,dq:'',dm:'',eq:'',sq:'',ssort:'owed',picked:new Set(),busy:false};
try{const p=JSON.parse(ls.get(PREF_KEY)||'{}');if(p.tab)S.tab=p.tab;if(p.pg!=null)S.pg=p.pg;if(p.showMk!=null)S.showMk=p.showMk}catch(e){}
function savePref(){ls.set(PREF_KEY,JSON.stringify({tab:S.tab,pg:S.pg,showMk:S.showMk}))}
{const t=today();S.calY=+t.slice(0,4);S.calM=+t.slice(5,7)}

/* 기록 하나의 상태 (노션 '보강 전/보강 완료/소멸' 보기와 같은 기준 + 예약·확인 필요) */
function info(r){
  const t=today();
  if(!r.d||!r.n)return {key:'nodate',label:r.d?'이름 없음':'날짜 없음'};
  const exp=addMonths(r.d,S.set.expireMonths||2), left=diff(t,exp);
  const base={exp,left};
  if(r.s==='완료')return {...base,key:'done',label:'완료'+(r.k?' '+md(r.k):'')};
  if(r.s==='종료')return {...base,key:'closed',label:'종료'};
  if(r.k){if(r.k<t)return {...base,key:'check',label:'보강일 지남 '+md(r.k)};const pl=plan(r);return {...base,key:'booked',label:(r.k===t?'오늘 보강':'예약 '+md(r.k))+(pl?' · '+pl+'분':'')}}
  if(r.s==='예약 중')return {...base,key:'booked',label:'예약 중'};
  if(left<=0)return {...base,key:'expired',label:'소멸'};
  return {...base,key:'wait',label:'보강 전'};
}
function ddChip(i){if(i.left==null||!['wait','booked','check'].includes(i.key))return '';if(i.left<=0)return `<span class="dd urgent" title="소멸일 ${md(i.exp)}">기한 지남</span>`;const c=i.left<=7?'urgent':i.left<=14?'soon':'';return `<span class="dd ${c}" title="소멸일 ${kdate(i.exp)}">D-${i.left}</span>`}
function pill(i){return `<span class="pill st-${i.key}">${esc(i.label)}</span>`}
const OPEN=new Set(['wait','booked','check']);
function rem(r){if(r.s==='완료'||r.s==='종료')return 0;return Math.max((+r.m||0)-(+r.dm||0),0)}
function remSum(list){return list.reduce((a,r)=>a+rem(r),0)}
function isGone(r){const k=info(r).key;return k==='expired'||k==='closed'}
const SUBS=['리드인','한국사','트레이닝'];
function subOf(r){return r.sub||'리드인'}
function subChip(r){const s=subOf(r);return s==='리드인'?'':` <span class="dd subj s-${s==='한국사'?'h':'t'}">${s}</span>`}
function isShort(r){return r.memo==='수업 덜 함'}
function splitSum(list){let a=0,s=0;for(const r of list){if(isShort(r))s+=rem(r);else a+=rem(r)}return {a,s}}
function splitTxt(list){const x=splitSum(list);return x.s?`결석 ${mins(x.a)} · 덜 함 ${mins(x.s)}`:mins(x.a)}
function plan(r){const x=rem(r);return r.pm&&r.pm<x?+r.pm:x}
function rowsBy(fn){return S.rows.filter(fn)}
function indexRows(){S.byId=new Map(S.rows.map(r=>[r.id,r]))}

/* ---------- 시작 ---------- */
function show(v){$('loginView').classList.toggle('hidden',v!=='login');$('loadingView').classList.toggle('hidden',v!=='loading');
  ['main','nav','topright'].forEach(id=>$(id).classList.toggle('hidden',v!=='app'))}
function logout(silent){ls.del(TOKEN_KEY);S.token=null;show('login');if(silent)$('loginErr').textContent=ERR.AUTH}
async function login(){const pw=$('pw').value;if(!pw)return;$('btnLogin').disabled=true;$('loginErr').textContent='';
  try{const r=await api('bm_login',{p_pw:pw});S.token=r.token;ls.set(TOKEN_KEY,r.token);$('pw').value='';await load();if(S.onhiWait){const p=S.onhiWait;S.onhiWait=null;openOnhi(p)}}
  catch(e){$('loginErr').textContent=errText(e)}finally{$('btnLogin').disabled=false}}
async function load(){
  if(!S.token){show('login');return}
  if(!S.rows.length)show('loading');
  try{const b=await api('ab_bootstrap',{p_token:S.token});
    S.rows=b.rows||[];S.allocs=b.allocs||[];S.students=b.students||[];S.set=b.settings||S.set;S.pending=b.pending||0;S.pulledAt=S.set.pulledAt||S.pulledAt;
    S.stuMap=new Map(S.students.map(s=>[s.n,s]));indexRows();show('app');render()}
  catch(e){if(String(e.message)!=='AUTH'){show(S.rows.length?'app':'login');$('loginErr').textContent=errText(e);toast(errText(e),true)}}
}
let pulling=false;
async function pull(full){
  if(pulling||!S.token)return;pulling=true;syncPill('맞추는 중...');
  try{const r=await api('ab_pull',{p_token:S.token,p_full:!!full});
    if(!r.skipped)S.pulledAt=new Date().toISOString();if(r.pending!=null)S.pending=r.pending;
    if(r.changed>0){await load();toast(`노션에서 ${r.changed}건 바뀐 내용을 가져왔어요.`)}else if(full)toast('노션과 같아요. 바뀐 내용이 없어요.');}
  catch(e){if(full)toast(errText(e),true)}
  finally{pulling=false;syncPill()}
}
async function pushPending(quiet){if(!S.token)return;syncPill('노션에 보내는 중...');try{const r=await api('ab_push_pending',{p_token:S.token});S.pending=r.pending;if(!quiet)toast(r.pending?`노션에 ${r.sent}건 보냈고 ${r.pending}건은 아직 못 보냈어요.`:'노션 백업이 모두 최신이에요.',!!r.pending);if(r.sent)await load()}catch(e){if(!quiet)toast(errText(e),true)}finally{syncPill()}}
function syncPill(txt){const el=$('syncPill');if(txt){el.textContent=txt;return}
  if(S.pending>0){el.textContent=`노션에 못 보낸 기록 ${S.pending}건 · 다시 보내기`;el.classList.add('warn')}
  else{el.textContent='노션 백업 정상';el.classList.remove('warn')}}

/* ---------- 저장 ---------- */
function upsertLocal(row){const i=S.rows.findIndex(r=>r.id===row.id);if(i>=0)S.rows[i]=row;else S.rows.push(row);indexRows()}
function afterSync(synced){if(!synced){S.pending++;toast('앱에는 저장했어요. 노션에는 연결이 되면 다시 보낼게요.',true)}syncPill()}
async function saveRow(p){const r=await api('ab_save',{p_token:S.token,p});upsertLocal(r.row);afterSync(r.synced);render();return r.row}
async function setStatus(id,st,k){const r=await api('ab_set_status',{p_token:S.token,p_id:id,p_status:st,p_makeup:k||null});upsertLocal(r.row);afterSync(r.synced);return r.row}
async function delRow(id){const r=await api('ab_delete',{p_token:S.token,p_id:id});S.rows=S.rows.filter(x=>x.id!==id);indexRows();afterSync(r.synced);render()}

/* ---------- 화면 ---------- */
const TABS=[['home','오늘'],['cal','캘린더'],['pend','보강 전'],['done','보강 완료'],['exp','소멸'],['stu','학생별'],['stat','통계']];
function counts(){const c={pend:0,done:0,exp:0,check:0};for(const r of S.rows){const k=info(r).key;if(OPEN.has(k))c.pend++;if(k==='check')c.check++;if(k==='done')c.done++;if(k==='expired')c.exp++}return c}
function renderNav(c){$('nav').innerHTML=TABS.map(([k,l])=>{const n=k==='pend'?c.pend:k==='exp'?c.exp:null;return `<button data-tab="${k}" class="${S.tab===k?'on':''}">${l}${n!=null?`<span class="cnt">${n}</span>`:''}</button>`}).join('')+'<span class="sp"></span><button class="outline addbtn2" data-act="makeupStu" data-n="">+ 보강 기록</button><button class="primary addbtn" data-act="add">+ 결석 기록</button>'}
function render(){
  const c=counts();renderNav(c);syncPill();
  const f={home:vHome,cal:vCal,pend:vPend,done:vDone,exp:vExp,stu:vStu,stat:vStat}[S.tab]||vHome;
  $('main').innerHTML=f(c);renderBulk();
}
function setTab(t){S.tab=t;S.picked.clear();savePref();render();window.scrollTo(0,0)}

function rowLine(r,o={}){const i=info(r);const st=S.stuMap.get(r.n);
  const acts=[];
  if(OPEN.has(i.key)||i.key==='expired'){acts.push(`<button class="mini b" data-act="book" data-id="${r.id}">${r.k?'날짜 바꾸기':'예약'}</button>`);acts.push(`<button class="mini g" data-act="makeup" data-id="${r.id}" title="보강한 시간 기록 (일부만 해도 돼요)">보강함</button>`)}
  if(i.key==='expired')acts.push(`<button class="mini" data-act="closeOne" data-id="${r.id}" title="소멸된 기록 지우기">삭제</button>`);
  if(i.key==='done'||i.key==='closed')acts.push(`<button class="mini" data-act="reopen" data-id="${r.id}">되돌리기</button>`);
  return `<div class="row" data-id="${r.id}">
    ${o.check?`<input type="checkbox" class="cbx" data-act="pick" data-id="${r.id}" ${S.picked.has(r.id)?'checked':''}>`:''}
    ${o.noName?'':`<span class="nm" data-act="student" data-n="${esc(r.n)}">${esc(r.n||'(이름 없음)')}${st&&st.s!=='재원'?` <small style="color:var(--muted);font-weight:600">${esc(st.s)}</small>`:''}</span>`}
    <span class="dt" data-act="edit" data-id="${r.id}">${r.d?ymd(r.d):'날짜 없음'}</span>
    <span class="mn">${r.m!=null?esc(r.m)+'분':'-'}</span>${subChip(r)}
    ${pill(i)} ${ddChip(i)}${(+r.dm||0)>0&&OPEN.has(i.key)?` <span class="dd part" title="보강한 시간 / 남은 시간">${r.dm}분 함 · ${rem(r)}분 남음</span>`:''}
    <span class="memo" data-act="edit" data-id="${r.id}" title="${esc(r.memo)}">${esc(r.memo)}${r.sync==='pending'?' <span class="dd soon" title="노션에 아직 못 보냈어요">노션 대기</span>':''}</span>
    <span class="acts">${acts.join('')}<button class="mini" data-act="edit" data-id="${r.id}">수정</button></span></div>`}

/* 오늘 */
function vHome(c){const t=today();
  const open=rowsBy(r=>OPEN.has(info(r).key));
  const owed=remSum(open);
  const soon=open.filter(r=>{const i=info(r);return i.key==='wait'&&i.left<=14}).sort((a,b)=>info(a).left-info(b).left);
  const check=rowsBy(r=>info(r).key==='check').sort((a,b)=>a.k<b.k?-1:1);
  const todayAl=new Set(S.allocs.filter(x=>x.d===t).map(x=>x.a));const todayMk=rowsBy(r=>(r.k===t||todayAl.has(r.id))&&r.s!=='종료').sort((a,b)=>a.n.localeCompare(b.n));
  const upcoming=rowsBy(r=>r.k&&r.k>t&&r.k<=addDays(t,7)&&r.s!=='완료'&&r.s!=='종료').sort((a,b)=>a.k<b.k?-1:a.k>b.k?1:a.n.localeCompare(b.n));
  const todayAb=rowsBy(r=>r.d===t).sort((a,b)=>a.n.localeCompare(b.n));
  const ym=t.slice(0,7), monthRows=rowsBy(r=>r.d&&r.d.startsWith(ym));
  const sec=(title,hint,list,o={})=>`<section class="card sec"><h3>${title} <span class="n">${list.length}건</span>${o.btn||''}</h3>${hint?`<p class="hint">${hint}</p>`:''}<div class="rows">${list.length?list.map(r=>rowLine(r)).join(''):`<div class="empty">${o.empty||'없어요.'}</div>`}</div></section>`;
  return `
  <div class="stats">

/* 캘린더 */
const CV_DEF={ab:true,sh:false,bk:true,mk:false,done:false};
function cvGet(){try{return Object.assign({},CV_DEF,JSON.parse(ls.get('absence.cv.v1')||'{}'))}catch(e){return {...CV_DEF}}}
function vCal(){const y=S.calY,m=S.calM,t=today(),cv=cvGet();
  const first=`${y}-${String(m).padStart(2,'0')}-01`;const start=addDays(first,-pd(first).getUTCDay());
  const lastDay=addDays(addMonths(first,1),-1);const end=addDays(lastDay,6-pd(lastDay).getUTCDay());
  const ym=first.slice(0,7),q=S.calQ.trim();
  const isDone=r=>r.s==='완료'||r.s==='종료';
  // 날짜별로 모으기
  const day=new Map();const put=(d,k,o)=>{if(d<start||d>end)return;if(!day.has(d))day.set(d,{ab:[],sh:[],bk:[],mk:[]});day.get(d)[k].push(o)};
  const cnt={ab:0,sh:0,bk:0,mk:0};
  for(const r of S.rows){if(!r.d||!r.n)continue;const sh=isShort(r);
    if(cv.done||!isDone(r)){put(r.d,sh?'sh':'ab',r)}
    if(r.d.startsWith(ym)&&(cv.done||!isDone(r)))cnt[sh?'sh':'ab']++;
    if(r.k&&!isDone(r)){put(r.k,'bk',r);if(r.k.startsWith(ym))cnt.bk++}}
  const gm=new Map();for(const x of S.allocs){const ar=S.byId.get(x.a);const sb=ar&&subOf(ar)!=='리드인'?subOf(ar).slice(0,1):'';const key=x.g+'|'+sb;if(!gm.has(key))gm.set(key,{n:x.n,d:x.d,m:0,sb,more:/더 하고 감/.test(x.memo||'')});gm.get(key).m+=x.m}
  for(const o of gm.values()){put(o.d,'mk',o);if(o.d.startsWith(ym))cnt.mk++}
  for(const r of S.rows){if(r.s==='완료'&&r.k&&!S.allocs.some(x=>x.a===r.id)){put(r.k,'mk',{n:r.n,d:r.k,m:r.m,id:r.id});if(r.k.startsWith(ym))cnt.mk++}}
  const nm=(n,txt,attrs)=>`<span class="nmi ${q&&!match(n,q)?'dim':''}" ${attrs}>${esc(n)}${txt!=null&&txt!==''?`<em>${txt}</em>`:''}</span>`;
  const line=(cls,tag,items)=>items.length?`<div class="ln ${cls}"><span class="tg">${tag}</span><span class="nms">${items.join('')}</span></div>`:'';
  let cells='';for(let d=start;d<=end;d=addDays(d,1)){
    const o=day.get(d)||{ab:[],sh:[],bk:[],mk:[]};const wd=pd(d).getUTCDay();let body='';
    if(cv.ab){const by={};o.ab.sort((a,b)=>a.n.localeCompare(b.n)).forEach(r=>{const k=info(r).key;(by[k]=by[k]||[]).push(r)});
      for(const k of ['wait','booked','check','expired','done','closed'])if(by[k])body+=line('st-'+k,'결석',by[k].map(r=>nm(r.n+(subOf(r)==='리드인'?'':'('+subOf(r).slice(0,1)+')'),r.m,`data-act="edit" data-id="${r.id}" title="${esc(r.n)} ${r.m}분 · ${esc(info(r).label)}"`)))}
    if(cv.sh){const by={};o.sh.sort((a,b)=>a.n.localeCompare(b.n)).forEach(r=>{const k=info(r).key;(by[k]=by[k]||[]).push(r)});
      for(const k of ['wait','booked','check','expired','done','closed'])if(by[k])body+=line('sh st-'+k,'덜',by[k].map(r=>nm(r.n,r.m,`data-act="edit" data-id="${r.id}" title="${esc(r.n)} 수업 덜 함 ${r.m}분 · ${esc(info(r).label)}"`)))}
    if(cv.bk&&o.bk.length){const late=o.bk.filter(r=>r.k<t),up=o.bk.filter(r=>r.k>=t);
      body+=line('bk','보강',up.sort((a,b)=>a.n.localeCompare(b.n)).map(r=>nm(r.n,plan(r)||'',`data-act="edit" data-id="${r.id}" title="보강 예약: ${esc(r.n)} ${plan(r)}분 (${mdw(r.d)} 결석분)"`)));
      body+=line('bk late','확인',late.sort((a,b)=>a.n.localeCompare(b.n)).map(r=>nm(r.n,plan(r)||'',`data-act="edit" data-id="${r.id}" title="보강일이 지났어요: ${esc(r.n)} (${mdw(r.d)} 결석분) · 완료 확인"`)))}
    if(cv.mk&&o.mk.length){const per=new Map();o.mk.forEach(x=>{const key=x.n+'|'+(x.sb||'');const z=per.get(key)||{n:x.n,sb:x.sb||'',m:0,more:false};z.m+=(+x.m||0);z.more=z.more||x.more;per.set(key,z)});
      body+=line('mk','보강함',[...per.values()].sort((a,b)=>a.n.localeCompare(b.n)).map(z=>nm(z.n+(z.sb?'('+z.sb+')':''),(z.more?'+':'')+z.m,`data-act="student" data-n="${esc(z.n)}" title="${esc(z.n)} ${z.m}분 보강${z.more?' (더 하고 간 시간 포함)':''}"`)))}
    const nAb=o.ab.filter(r=>!isDone(r)).length;
    cells+=`<div class="cell ${d.slice(0,7)!==ym?'out':''} ${d===t?'today':''} ${wd===0?'sun':''}" data-act="dayAdd" data-d="${d}">
      <div class="dn"><span>${+d.slice(8)===1||d===start?(+d.slice(5,7))+'월 '+(+d.slice(8))+'일':+d.slice(8)}</span></div>${body}</div>`}
  const tg=(k,l,cls)=>`<button class="vt ${cls} ${cv[k]?'on':''}" data-act="cv" data-v="${k}" title="${cv[k]?'누르면 숨겨요':'누르면 보여요'}"><span class="sw"></span>${l}<b>${cnt[k]}</b></button>`;
  const mRows=S.rows.filter(r=>r.d&&r.d.startsWith(ym));
  return `<div class="calhead"><div class="calnav"><button class="nb" data-act="calMove" data-v="-1" title="지난 달">‹</button><h2>${y}년 ${m}월</h2><button class="nb" data-act="calMove" data-v="1" title="다음 달">›</button></div>
    <button class="ghost" data-act="calMove" data-v="0">오늘</button>
    <span style="flex:1"></span>
    <input class="search" id="calQ" placeholder="학생 찾기 (초성 가능)" value="${esc(S.calQ)}" autocomplete="off"></div>
    <div class="viewbar"><div class="vgroup"><span class="vlabel" title="버튼 숫자는 지금 캘린더에 보이는 건수예요">보기</span>${tg('ab','결석','v-ab')}${tg('sh','덜 함','v-sh')}${tg('bk','보강 예약','v-bk')}${tg('mk','보강함','v-mk')}</div>
      <button class="vswitch ${cv.done?'on':''}" data-act="cv" data-v="done"><span class="knob"></span>보강 끝난 결석·덜 함도 보기</button></div>
    <div id="vbody">
    <div class="cal">${[...DOW].map((w,i)=>`<div class="wd ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}${cells}</div>
    <div class="legend"><span class="ln st-wait lg"><span class="tg">결석</span>보강 전</span><span class="ln st-booked lg"><span class="tg">결석</span>예약됨</span><span class="ln st-done lg"><span class="tg">결석</span>완료</span><span class="ln sh st-wait lg"><span class="tg">덜</span>수업 덜 함</span><span class="ln bk lg"><span class="tg">보강</span>예약 (할 분)</span><span class="ln bk late lg"><span class="tg">확인</span>보강일 지남</span><span class="ln mk lg"><span class="tg">보강함</span>한 날 (+는 더 하고 감)</span></div></div>`}

/* 보강 전 */
function pendRows(){const q=S.pq.trim();return rowsBy(r=>{const i=info(r);if(!OPEN.has(i.key))return false;if(!match(r.n,q))return false;if(S.pt==='ab'&&isShort(r))return false;if(S.pt==='short'&&!isShort(r))return false;
  if(S.pf==='wait')return i.key==='wait';if(S.pf==='booked')return i.key==='booked';if(S.pf==='check')return i.key==='check';if(S.pf==='soon')return i.left<=14&&i.key!=='booked';return true})}
function vPend(){const list=pendRows();const nod=rowsBy(r=>info(r).key==='nodate');
  const total=remSum(list);
  const cnt=k=>rowsBy(r=>{const i=info(r);return k==='all'?OPEN.has(i.key):k==='soon'?(OPEN.has(i.key)&&i.left<=14&&i.key!=='booked'):i.key===k}).length;
  const chips=[['all','전체'],['wait','보강 전'],['booked','예약됨'],['check','보강일 지남'],['soon','2주 안 소멸']].map(([k,l])=>`<button class="chip ${S.pf===k?'on':''}" data-act="pf" data-v="${k}">${l} <b>${cnt(k)}</b></button>`).join('');
  const openAll=rowsBy(r=>OPEN.has(info(r).key)),ss=splitSum(openAll);
  const tchips=[['all','결석+덜 함',ss.a+ss.s],['ab','결석만',ss.a],['short','덜 함만',ss.s]].map(([k,l,v])=>`<button class="chip ${S.pt===k?'on':''}" data-act="pt" data-v="${k}">${l} <b>${mins(v)}</b></button>`).join('');
  let body='';
  if(S.pg){const g=new Map();for(const r of list){if(!g.has(r.n))g.set(r.n,[]);g.get(r.n).push(r)}
    const names=[...g.keys()].sort((a,b)=>a.localeCompare(b));
    body=names.map(n=>{const rs=g.get(n).sort((a,b)=>a.d<b.d?-1:1);const st=S.stuMap.get(n);const tot=remSum(rs);
      const minLeft=Math.min(...rs.filter(r=>info(r).key==='wait').map(r=>info(r).left));
      const allPicked=rs.every(r=>S.picked.has(r.id));
      return `<div class="card grp"><div class="gh"><input type="checkbox" class="cbx" data-act="pickGroup" data-n="${esc(n)}" ${allPicked?'checked':''} title="이 학생 기록 모두 선택">
        <span class="gn" data-act="student" data-n="${esc(n)}">${esc(n)}</span><span class="gs">${st?esc([shortGrade(st.g),st.s!=='재원'?st.s:''].filter(Boolean).join(' · ')):''}</span>
        ${isFinite(minLeft)?ddChip({key:'wait',left:minLeft,exp:addDays(today(),minLeft)}):''}
        <button class="mini g" data-act="makeupStu" data-n="${esc(n)}" title="이 학생 보강한 시간 기록">보강 기록</button><button class="mini" data-act="msg" data-n="${esc(n)}" title="학부모 안내 문구 만들기">안내 문구</button>
        <span class="tot">${rs.length}건 · ${splitTxt(rs)}</span></div>
        <div class="rows">${rs.map(r=>rowLine(r,{check:true,noName:true})).join('')}</div></div>`}).join('');
  }else{body=`<div class="card sec"><div class="rows">${list.sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:a.n.localeCompare(b.n)).map(r=>rowLine(r,{check:true})).join('')}</div></div>`}
  return `<div class="toolbar"><input class="search" id="pq" placeholder="이름 검색 (초성 가능)" value="${esc(S.pq)}" autocomplete="off">${chips}<span class="sp"></span>
    <button class="chip ${S.pg?'on':''}" data-act="pg">학생별로 묶기</button></div><div id="vbody">
    ${nod.length?`<div class="banner">이름이나 날짜가 비어 있는 기록이 ${nod.length}건 있어요 (노션의 '날짜 없음'). <button class="mini" data-act="showNodate">보기·정리</button></div>`:''}
    <div class="sum" style="margin-bottom:10px">${list.length}건 · 합계 <b>${mins(total)}</b>${splitSum(list).s&&splitSum(list).a?` (결석 ${mins(splitSum(list).a)} · 덜 함 ${mins(splitSum(list).s)})`:''} · 학생 ${new Set(list.map(r=>r.n)).size}명 &nbsp;|&nbsp; 여러 건을 체크하면 한 번에 예약·완료할 수 있어요.</div>
    ${body||'<div class="card sec"><div class="empty">해당하는 기록이 없어요.</div></div>'}</div>`}

/* 보강 완료 */
function vDone(){const q=S.dq.trim();let list=rowsBy(r=>{const k=info(r).key;return k==='done'&&match(r.n,q)});
  const months=[...new Set(rowsBy(r=>r.s==='완료').map(r=>(r.k||r.d||'').slice(0,7)).filter(Boolean))].sort().reverse();
  if(S.dm)list=list.filter(r=>(r.k||r.d||'').startsWith(S.dm));
  list.sort((a,b)=>{const x=a.k||a.d||'',y=b.k||b.d||'';return x<y?1:x>y?-1:a.n.localeCompare(b.n)});
  const tot=list.reduce((a,r)=>a+(r.s==='완료'?(+r.m||0):0),0);
  return `<div class="toolbar"><input class="search" id="dq" placeholder="이름 검색 (초성 가능)" value="${esc(S.dq)}" autocomplete="off">
    <select class="inp" id="dm"><option value="">모든 달 (보강일 기준)</option>${months.map(m=>`<option value="${m}" ${S.dm===m?'selected':''}>${m.slice(0,4)}년 ${+m.slice(5)}월</option>`).join('')}</select>
    </div><div id="vbody"><div class="sum" style="margin:-4px 0 8px">${list.length}건 · 보강한 시간 <b>${mins(tot)}</b></div>
    <div class="tw"><table class="t"><thead><tr><th>이름</th><th>결석일</th><th class="num">시간</th><th>보강일</th><th>상태</th><th>메모</th><th></th></tr></thead><tbody>
    ${list.map(r=>`<tr><td><span class="nm" style="font-weight:800;cursor:pointer" data-act="student" data-n="${esc(r.n)}">${esc(r.n)}</span></td><td>${ymd(r.d)}</td><td class="num">${r.m!=null?r.m+'분':'-'}</td><td>${r.k?ymd(r.k):'<span style="color:#b0bbb7">-</span>'}</td><td>${pill(info(r))}</td><td style="color:var(--muted);max-width:220px">${esc(r.memo)}</td><td style="text-align:right;white-space:nowrap"><button class="mini" data-act="reopen" data-id="${r.id}">되돌리기</button> <button class="mini" data-act="edit" data-id="${r.id}">수정</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">기록이 없어요.</td></tr>'}
    </tbody></table></div></div>`}

/* 소멸 */
function vExp(){const q=S.eq.trim();const list=rowsBy(r=>info(r).key==='expired'&&match(r.n,q)).sort((a,b)=>a.n.localeCompare(b.n)||(a.d<b.d?-1:1));
  return `<div class="toolbar"><input class="search" id="eq" placeholder="이름 검색 (초성 가능)" value="${esc(S.eq)}" autocomplete="off"><span class="sp"></span>${list.length?`<button class="danger" data-act="closeAll">${q?'검색된 ':'' }${list.length}건 모두 삭제</button>`:''}</div><div id="vbody">
    <div class="sum" style="margin:-4px 0 6px">새로 소멸된 ${list.length}건 · ${splitTxt(list)}</div>
    <p class="sum" style="margin:-4px 0 12px">결석일로부터 ${S.set.expireMonths||2}개월이 지나 보강 기한이 끝난 기록이에요. 삭제하면 앱과 노션에서 지워져요(노션은 휴지통으로, 설정 > 지운 기록에서 최근 것은 되살릴 수 있어요). 예외로 보강해 줄 때는 <b>예약</b>을 누르면 다시 '보강 전'으로 올라가요.</p>
    <div class="card sec"><div class="rows">${list.map(r=>rowLine(r,{check:true})).join('')||'<div class="empty">새로 소멸된 기록이 없어요.</div>'}</div></div></div>`}
async function closeGone(ids){if(!ids.length)return;
  const r=await api('ab_delete_many',{p_token:S.token,p_ids:ids});const del=new Set(ids);S.rows=S.rows.filter(x=>!del.has(x.id));indexRows();S.picked.clear();S.pending=r.pending;render();
  toast(`${r.deleted}건을 지웠어요. 노션 백업에서도 지우는 중이에요...`);
  for(let i=0;i<40&&S.pending>0;i++){try{const p=await api('ab_push_pending',{p_token:S.token});S.pending=p.pending;syncPill(`노션 백업 중... 남은 ${p.pending}건`);if(!p.sent&&p.pending)break}catch(e){break}}
  await load();toast(S.pending?`삭제는 끝났어요. 노션에 못 보낸 ${S.pending}건은 위쪽 버튼으로 다시 보내 주세요.`:'삭제를 마쳤고 노션에서도 지웠어요.',!!S.pending)}

/* 학생별 */
function stuStats(){const m=new Map();
  const get=n=>{if(!m.has(n))m.set(n,{n,total:0,owed:0,owedN:0,owedS:0,owedSN:0,done:0,exp:0,last:'',expSoon:null});return m.get(n)};
  for(const s of S.students)if(s.s==='재원')get(s.n);
  for(const r of S.rows){if(!r.n)continue;const x=get(r.n),i=info(r);x.total++;if(r.d&&r.d>x.last)x.last=r.d;
    if(OPEN.has(i.key)){if(isShort(r)){x.owedS+=rem(r);x.owedSN++}else{x.owed+=rem(r);x.owedN++}if(i.key==='wait'&&(x.expSoon==null||i.left<x.expSoon))x.expSoon=i.left}
    if(i.key==='done')x.done++;if(i.key==='expired'||i.key==='closed')x.exp++}
  return [...m.values()]}
function vStu(){const q=S.sq.trim();let list=stuStats().filter(x=>match(x.n,q));
  const ac=r=>{const s=S.stuMap.get(r.n);return s?s.s:'기록만'};
  if(S.sfilter&&S.sfilter!=='all')list=list.filter(x=>ac(x)===S.sfilter);
  const srt={owed:(a,b)=>(b.owed+b.owedS)-(a.owed+a.owedS)||a.n.localeCompare(b.n),owedS:(a,b)=>b.owedS-a.owedS||a.n.localeCompare(b.n),name:(a,b)=>a.n.localeCompare(b.n),total:(a,b)=>b.total-a.total,last:(a,b)=>(b.last||'').localeCompare(a.last||''),exp:(a,b)=>b.exp-a.exp}[S.ssort]||((a,b)=>0);
  list.sort(srt);
  const th=(k,l,c='')=>`<th class="${c}" data-act="ssort" data-v="${k}">${l}${S.ssort===k?' ▾':''}</th>`;
  return `<div class="toolbar"><input class="search" id="sq" placeholder="이름 검색 (초성 가능)" value="${esc(S.sq)}" autocomplete="off">

/* 통계 */
function vStat(){const t=today();const months=[];for(let i=11;i>=0;i--)months.push(addMonths(t.slice(0,7)+'-01',-i).slice(0,7));
  const data=months.map(m=>{const rs=S.rows.filter(r=>r.d&&r.d.startsWith(m));return {m,n:rs.length,min:rs.reduce((a,r)=>a+(+r.m||0),0),done:rs.filter(r=>r.s==='완료').length,exp:rs.filter(isGone).length}});
  const mx=Math.max(1,...data.map(d=>d.n));
  const wd=[0,0,0,0,0,0,0];const since=addMonths(t,-3);const recent=S.rows.filter(r=>r.d&&r.d>=since);recent.forEach(r=>wd[pd(r.d).getUTCDay()]++);const wmx=Math.max(1,...wd);
  const top=new Map();recent.forEach(r=>{if(!r.n)return;const x=top.get(r.n)||{n:0,m:0};x.n++;x.m+=(+r.m||0);top.set(r.n,x)});
  const tops=[...top.entries()].sort((a,b)=>b[1].n-a[1].n||b[1].m-a[1].m).slice(0,10);const tmx=Math.max(1,...tops.map(x=>x[1].n));
  const closed=S.rows.filter(r=>{const k=info(r).key;return k==='done'||k==='expired'||k==='closed'});
  const rate=closed.length?Math.round(closed.filter(r=>r.s==='완료').length/closed.length*100):0;
  const done=S.rows.filter(r=>r.s==='완료'&&r.k&&r.d);const lag=done.length?Math.round(done.reduce((a,r)=>a+Math.max(0,diff(r.d,r.k)),0)/done.length):0;
  return `<div class="stats">
    <div class="card stat"><div class="l">전체 결석 기록</div><div class="v">${S.rows.filter(r=>r.d).length}건</div><div class="s">${S.rows.length?'첫 기록 '+ymd(S.rows.filter(r=>r.d).map(r=>r.d).sort()[0]):''}</div></div>
    <div class="card stat"><div class="l">보강 완료율</div><div class="v">${rate}%</div><div class="s">마감된 기록 중 보강까지 한 비율</div></div>
    <div class="card stat"><div class="l">결석 → 보강까지</div><div class="v">평균 ${lag}일</div><div class="s">보강일이 적힌 완료 기록 ${done.length}건 기준</div></div>
    <div class="card stat red"><div class="l">소멸된 시간 (최근 12개월)</div><div class="v">${mins(data.reduce((a,d)=>a+S.rows.filter(r=>r.d&&r.d.startsWith(d.m)&&isGone(r)).reduce((x,r)=>x+rem(r)+(r.s==='종료'?Math.max((+r.m||0)-(+r.dm||0),0):0),0),0))}</div><div class="s">${data.reduce((a,d)=>a+d.exp,0)}건</div></div></div>
  <section class="card sec"><h3>달별 결석 <span class="n">최근 12개월 · 진한 막대 = 결석, 연한 부분 = 그중 보강 완료</span></h3>
    <div class="bars">${data.map(d=>`<div class="bar" title="${d.m}: 결석 ${d.n}건 · ${mins(d.min)} · 보강 완료 ${d.done}건 · 소멸 ${d.exp}건"><span class="v">${d.n}</span><div class="b" style="height:${d.n/mx*100}%"><div class="dn" style="height:${d.n?d.done/d.n*100:0}%"></div></div><span class="l">${+d.m.slice(5)}월</span></div>`).join('')}</div>
    <div class="tw" style="margin-top:12px;max-height:none"><table class="t"><thead><tr><th>달</th><th class="num">결석</th><th class="num">빠진 시간</th><th class="num">보강 완료</th><th class="num">소멸</th><th class="num">아직 보강 전</th></tr></thead><tbody>
    ${data.slice().reverse().map(d=>`<tr><td>${d.m.slice(0,4)}년 ${+d.m.slice(5)}월</td><td class="num">${d.n}</td><td class="num">${mins(d.min)}</td><td class="num">${d.done}</td><td class="num">${d.exp}</td><td class="num">${S.rows.filter(r=>r.d&&r.d.startsWith(d.m)&&OPEN.has(info(r).key)).length}</td></tr>`).join('')}</tbody></table></div></section>
  <div class="grid2"><section class="card sec"><h3>요일별 결석 <span class="n">최근 3개월</span></h3>
    ${[1,2,3,4,5,6,0].map(i=>`<div class="hbar"><span class="k">${DOW[i]}요일</span><div class="track"><div class="fill" style="width:${wd[i]/wmx*100}%"></div></div><span class="v">${wd[i]}건</span></div>`).join('')}</section>
  <section class="card sec"><h3>결석이 많은 학생 <span class="n">최근 3개월 상위 10명</span></h3>
    ${tops.map(([n,x])=>`<div class="hbar"><span class="k" data-act="student" data-n="${esc(n)}">${esc(n)}</span><div class="track"><div class="fill" style="width:${x.n/tmx*100}%;background:#c98a2b"></div></div><span class="v">${x.n}건 · ${mins(x.m)}</span></div>`).join('')||'<div class="empty">기록이 없어요.</div>'}</section></div>
  <div style="margin-top:6px"><button class="outline" data-act="csv">전체 기록 엑셀(CSV)로 받기</button></div>`}

/* ---------- 선택 일괄 처리 ---------- */
function renderBulk(){const el=$('bulk');if(!S.picked.size||(S.tab!=='pend'&&S.tab!=='exp')){el.classList.add('hidden');return}
  if(S.tab==='exp'){const rs0=[...S.picked].map(id=>S.byId.get(id)).filter(Boolean);el.innerHTML=`<span><b>${rs0.length}건</b> 선택 · ${splitTxt(rs0)}</span><button class="w" data-act="closePicked">선택한 것 삭제</button><button class="x" data-act="bulkClear">선택 해제</button>`;el.classList.remove('hidden');return}
  const rs=[...S.picked].map(id=>S.byId.get(id)).filter(Boolean);const tot=remSum(rs);
  el.innerHTML=`<span><b>${rs.length}건</b> 선택 · ${splitTxt(rs)}</span><button class="w" data-act="bulkBook">한 번에 예약</button><button class="w" data-act="bulkDone">한 번에 완료</button><button class="w" data-act="bulkMsg">안내 문구</button><button class="x" data-act="bulkClear">선택 해제</button>`;
  el.classList.remove('hidden')}
async function bulkMakeup(rs){const k=await askDate('보강한 날짜',`선택한 ${rs.length}건(${ns2(rs)}명)의 남은 시간을 모두 보강한 것으로 기록해요. 일부만 했으면 학생별 '보강 기록'을 써 주세요.`,today(),'완료 처리');if(!k)return;
  let ok=0,fail=0;for(const r of rs){toast(`처리하는 중... ${ok+fail+1}/${rs.length}`);try{const x=await api('ab_makeup',{p_token:S.token,p:{d:k,m:Math.max(rem(r),1),ids:[r.id]}});(x.rows||[]).forEach(upsertLocal);S.allocs.push(...(x.allocs||[]));if(x.failed)S.pending+=x.failed;ok++}catch(e){fail++}}
  S.picked.clear();render();toast(fail?`${ok}건 처리, ${fail}건은 실패했어요.`:`${ok}건을 보강 완료로 기록했어요.`,!!fail)}
function ns2(rs){return new Set(rs.map(r=>r.n)).size}
async function bulk(st){const ids=[...S.picked];if(!ids.length)return;
  const k=await askDate(st==='완료'?'보강한 날짜':'보강 날짜',`선택한 ${ids.length}건을 ${st==='완료'?'보강 완료로':'이 날짜로 예약'} 처리해요.`,today(),st==='완료'?'완료 처리':'예약하기');if(!k)return;
  let ok=0,fail=0;for(const id of ids){toast(`처리하는 중... ${ok+fail+1}/${ids.length}`);try{await setStatus(id,st==='완료'?'완료':'예약 중',k);ok++}catch(e){fail++}}
  S.picked.clear();render();toast(fail?`${ok}건 처리, ${fail}건은 실패했어요.`:`${ok}건을 ${st==='완료'?'완료':'예약'} 처리했어요.`,!!fail)}

/* ---------- 모달 ---------- */
let modalClose=null;
function openModal(html,cls=''){closeModal();const d=document.createElement('div');d.className='mback';d.innerHTML=`<div class="modal ${cls}" role="dialog">${html}</div>`;
  d.addEventListener('mousedown',e=>{if(e.target===d)closeModal()});$('modalRoot').appendChild(d);return d.firstElementChild}
function closeModal(){$('modalRoot').innerHTML='';if(modalClose){const f=modalClose;modalClose=null;f()}}
function askDate(title,sub,def,okLabel){return new Promise(res=>{const m=openModal(`<h2>${esc(title)}</h2><div class="sub">${esc(sub)}</div>
  <div class="field"><div class="hrow"><input class="inp" type="date" id="adD" value="${def||''}"><button class="ghost" data-q="0">오늘</button><button class="ghost" data-q="1">내일</button><button class="ghost" data-q="-1">어제</button></div></div>
  <div class="mfoot"><span class="sp"></span><button class="ghost" id="adC">취소</button><button class="primary" id="adO">${esc(okLabel||'확인')}</button></div>`);
  let done=false;const fin=v=>{if(done)return;done=true;modalClose=null;closeModal();res(v)};modalClose=()=>{if(!done){done=true;res(null)}};
  m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{m.querySelector('#adD').value=addDays(today(),+b.dataset.q)});
  m.querySelector('#adC').onclick=()=>fin(null);m.querySelector('#adO').onclick=()=>{const v=m.querySelector('#adD').value;if(!v){toast('날짜를 골라 주세요.',true);return}fin(v)};
  m.querySelector('#adD').addEventListener('keydown',e=>{if(e.key==='Enter')m.querySelector('#adO').click()});setTimeout(()=>m.querySelector('#adO').focus(),30)})}

function askBook(r){return new Promise(res=>{const left=rem(r);let pm=r.pm&&r.pm<left?+r.pm:left;
  const m=openModal(`<h2>보강 예약</h2><div class="sub">${esc(r.n)} ${mdw(r.d)} 결석분 · 남은 시간 ${left}분${(+r.dm||0)>0?` (${r.dm}분은 이미 보강함)`:''}</div>
  <div class="field"><label>보강 날짜</label><div class="hrow"><input class="inp" type="date" id="bkD" value="${r.k&&r.k>=today()?r.k:addDays(today(),1)}"><button class="ghost" data-q="0">오늘</button><button class="ghost" data-q="1">내일</button><button class="ghost" data-q="2">모레</button></div></div>
  <div class="field"><label>그날 할 시간(분) <span style="font-weight:600;color:var(--muted)">(일부만 할 때만 바꾸세요)</span></label><div class="hrow"><input class="inp" style="max-width:110px" type="number" min="1" step="5" id="bkM" value="${pm}">분</div>
    <div class="sum" id="bkInfo" style="margin-top:6px"></div></div>
  <div class="mfoot"><span class="sp"></span><button class="ghost" id="bkC">취소</button><button class="primary" id="bkO">예약하기</button></div>`);
  let done=false;const fin=v=>{if(done)return;done=true;modalClose=null;closeModal();res(v)};modalClose=()=>{if(!done){done=true;res(null)}};
  const draw=()=>{
    m.querySelector('#bkInfo').textContent=pm&&pm<left?`이날 ${pm}분 하고, ${left-pm}분은 남아요. 보강한 날 '보강함'을 누르면 ${pm}분이 미리 채워져 있어요.`:'이날 남은 시간을 모두 보강해요.'};
    m.querySelector('#bkM').oninput=e=>{pm=+e.target.value||0;if(pm>left)pm=left;draw()};
  m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{m.querySelector('#bkD').value=addDays(today(),+b.dataset.q)});
  m.querySelector('#bkC').onclick=()=>fin(null);
  m.querySelector('#bkO').onclick=()=>{const k=m.querySelector('#bkD').value;if(!k){toast('날짜를 골라 주세요.',true);return}if(!(pm>0)){toast('그날 할 시간을 적어 주세요.',true);return}fin({k,pm:pm>=left?null:pm})};
  m.addEventListener('keyup',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')m.querySelector('#bkO').click()});
  draw();setTimeout(()=>m.querySelector('#bkO').focus(),30)})}

function nameOptions(){const names=new Set(S.students.filter(s=>s.s==='재원').map(s=>s.n));S.rows.forEach(r=>r.n&&names.add(r.n));S.students.forEach(s=>names.add(s.n));return [...names]}
function lastMinutes(n){let best=null;for(const r of S.rows)if(r.n===n&&r.m!=null&&r.memo!=='수업 덜 함'&&(!best||r.d>best.d))best=r;return best?best.m:60}

/* 캘린더 날짜를 눌렀을 때 */
function openDayMenu(d){const m=openModal(`<h2>${kdate(d)}</h2><div class="sub">이날 무엇을 기록할까요?</div>

/* 결석 기록 (여러 명) */
function openAdd(day){const items=[];let d=day||today();let typ='';let sub='리드인';const QM=()=>typ?[10,15,20,30,40,50]:[30,50,60,90,120,180];const defM=n=>typ?null:lastMinutes(n);
  const act=S.students.filter(s=>s.s==='재원').sort((a,b)=>a.n.localeCompare(b.n));
  const m=openModal(`<h2>결석 기록</h2><div class="sub">여러 학생을 한 번에 기록할 수 있어요. 기록하면 노션 결석 캘린더에도 바로 들어가요. 수업 시간을 다 못 채운 날은 '수업 덜 함'으로 남은 시간만 적어 주세요.</div>
    <div class="field"><label>수업</label><div class="seg" id="amU">${SUBS.map(s=>`<button data-u="${s}">${s}</button>`).join('')}</div></div>
    <div class="field"><label>구분</label><div class="seg" id="amT"><button data-t="">결석</button><button data-t="수업 덜 함">수업 덜 함 (남은 시간은 다음에)</button></div></div>
    <div class="field"><label>결석 날짜</label><div class="hrow"><input class="inp" type="date" id="amD" value="${d}"><button class="ghost" data-q="0">오늘</button><span id="amDW" class="sum"></span></div></div>
    <div class="field"><label>학생</label><input class="inp" id="amQ" placeholder="이름 검색 (초성 가능) · Enter로 추가" autocomplete="off" spellcheck="false"><div class="sug" id="amSug"></div></div>
    <div class="am-list" id="amList"></div>
    <details class="more"><summary>재원생 명단에서 고르기 (${act.length}명)</summary><div class="sgrid" id="amGrid"></div></details>
    <div class="mfoot"><span class="sum" id="amSum"></span><span class="sp"></span><button class="ghost" id="amC">취소</button><button class="primary" id="amO">기록하기</button></div>`,'wide');
  const q=m.querySelector('#amQ');
  const isDup=n=>S.rows.some(r=>r.n===n&&r.d===d&&subOf(r)===sub);
  function add(n){n=n.trim();if(!n)return;if(items.some(x=>x.n===n)){toast(n+' 학생은 이미 넣었어요.');return}items.push({n,m:defM(n)});q.value='';draw();const ins=m.querySelectorAll('#amList input[data-i]');const last=ins[ins.length-1];if(last&&typ){last.focus();last.select()}else q.focus()}
  function draw(){
    m.querySelector('#amDW').textContent=d?kdate(d):'';m.querySelectorAll('#amU button').forEach(b=>b.classList.toggle('on',b.dataset.u===sub));m.querySelectorAll('#amT button').forEach(b=>b.classList.toggle('on',b.dataset.t===typ));
    m.querySelector('#amList').innerHTML=items.map((x,i)=>`<div class="am-item ${isDup(x.n)?'dup':''}"><span class="n">${esc(x.n)}</span>
      <input class="inp" type="number" min="0" step="5" value="${x.m??''}" data-i="${i}">분
      ${isDup(x.n)?`<span class="warn">이 날 ${sub} 결석이 이미 있어요 (건너뜀)</span>`:''}<button class="x" data-rm="${i}" title="빼기">×</button></div>`).join('')||'<div class="empty" style="padding:6px 2px">아직 고른 학생이 없어요.</div>';
    const v=items.filter(x=>!isDup(x.n));m.querySelector('#amSum').textContent=v.length?`${v.length}명 · ${mins(v.reduce((a,x)=>a+(+x.m||0),0))}`:'';
    m.querySelector('#amO').textContent=v.length?`${v.length}명 기록하기`:'기록하기';m.querySelector('#amO').disabled=!v.length;
    m.querySelector('#amGrid').innerHTML=act.map(s=>`<button data-pick="${esc(s.n)}" class="${items.some(x=>x.n===s.n)?'on':''}">${esc(s.n)}<small>${esc(shortGrade(s.g))}</small></button>`).join('');
    sug()}
  function sug(){const v=q.value.trim();const el=m.querySelector('#amSug');if(!v){el.innerHTML='';return}
    const all=nameOptions().filter(n=>match(n,v)&&!items.some(x=>x.n===n));const rank=n=>{const s=S.stuMap.get(n);return s&&s.s==='재원'?0:s?1:2};
    all.sort((a,b)=>rank(a)-rank(b)||a.localeCompare(b));
    el.innerHTML=all.slice(0,10).map(n=>{const s=S.stuMap.get(n);return `<button class="chip" data-add="${esc(n)}">${esc(n)}${s&&s.s!=='재원'?' · '+esc(s.s):''}</button>`}).join('')+(all.includes(v)||/^[ㄱ-ㅎ\s]+$/.test(v)?'':`<button class="chip" data-add="${esc(v)}" title="명단에 없는 이름 그대로 넣기">"${esc(v)}" 그대로 넣기</button>`)}
  m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.q!=null){d=addDays(today(),+b.dataset.q);m.querySelector('#amD').value=d;draw()}
    else if(b.dataset.t!=null){typ=b.dataset.t;items.forEach(x=>x.m=defM(x.n));draw()}
    else if(b.dataset.u!=null){sub=b.dataset.u;draw()}
    else if(b.dataset.add!=null)add(b.dataset.add);
    else if(b.dataset.pick!=null){const n=b.dataset.pick;const i=items.findIndex(x=>x.n===n);if(i>=0)items.splice(i,1);else items.push({n,m:defM(n)});draw()}
    else if(b.dataset.rm!=null){items.splice(+b.dataset.rm,1);draw()}
    else if(b.dataset.m!=null){items[+b.dataset.i].m=+b.dataset.m;draw()}});
  m.querySelector('#amList').addEventListener('input',e=>{if(e.target.dataset.i!=null){items[+e.target.dataset.i].m=e.target.value===''?null:+e.target.value;const v=items.filter(x=>!isDup(x.n));m.querySelector('#amSum').textContent=v.length?`${v.length}명 · ${mins(v.reduce((a,x)=>a+(+x.m||0),0))}`:''}});
  m.querySelector('#amD').addEventListener('change',e=>{d=e.target.value;draw()});
  q.addEventListener('input',sug);
  q.addEventListener('keyup',e=>{if(e.key==='Enter'){sug();const f=m.querySelector('#amSug [data-add]');if(f)add(f.dataset.add)}});
  m.querySelector('#amC').onclick=closeModal;
  m.querySelector('#amO').onclick=async()=>{const v=items.filter(x=>!isDup(x.n));if(!d){toast(ERR.EMPTYDAY,true);return}if(!v.length)return;
    const btn=m.querySelector('#amO');btn.disabled=true;btn.textContent='기록하는 중...';
    try{const r=await api('ab_add_many',{p_token:S.token,p:{d,items:v.map(x=>({n:x.n,m:x.m,memo:typ,sub}))}});
      (r.added||[]).forEach(upsertLocal);closeModal();if(r.failed){S.pending+=r.failed}render();
      toast(`${(r.added||[]).length}명 ${typ?'덜 한 수업':'결석'}을 기록했어요${r.dups&&r.dups.length?` (이미 있던 ${r.dups.length}명은 건너뜀)`:''}.${r.failed?' 노션에는 나중에 다시 보낼게요.':''}`,!!r.failed)}
    catch(e){toast(errText(e),true);btn.disabled=false;draw()}};
  draw();setTimeout(()=>q.focus(),30)}

/* 기록 수정 */
function openEdit(id){const r=S.byId.get(id);if(!r)return;const st=S.stuMap.get(r.n);
  const v={n:r.n,d:r.d||'',m:r.m,s:r.s,k:r.k||'',memo:r.memo||'',pm:r.pm||'',sub:subOf(r)};
  const m=openModal(`<h2>${esc(r.n||'(이름 없음)')} <span id="edPill"></span></h2><div class="sub">${r.d?kdate(r.d)+' 결석':''}${st?' · '+esc([st.s,shortGrade(st.g)].filter(Boolean).join(' · ')):''}</div>
    <div class="info" id="edInfo"></div>
    <div class="grid2" style="gap:10px"><div class="field"><label>이름</label><input class="inp" id="edN" list="edNL" value="${esc(v.n)}" autocomplete="off"><datalist id="edNL">${nameOptions().map(n=>`<option value="${esc(n)}">`).join('')}</datalist></div>
    <div class="field"><label>결석 날짜</label><input class="inp" type="date" id="edD" value="${v.d}"></div></div>
    <div class="field"><label>빠진 시간(분)</label><div class="hrow"><input class="inp" style="max-width:110px" type="number" min="0" step="5" id="edM" value="${v.m??''}">분</div></div>
    <div class="field"><label>수업</label><div class="seg" id="edU">${SUBS.map(x=>`<button data-u="${x}">${x}</button>`).join('')}</div></div>
    <div class="field"><label>보강 여부</label><div class="seg" id="edS">${ST_LIST.map(x=>`<button data-s="${x}">${x}</button>`).join('')}</div></div>
    <div class="field"><label>보강 날짜 <span style="font-weight:600;color:var(--muted)">(노션 비고 맨 앞에 '26/11/16'처럼 적혀요)</span></label><div class="hrow"><input class="inp" type="date" id="edK" value="${v.k}"><button class="ghost" data-k="0">오늘</button><button class="ghost" data-k="1">내일</button><button class="ghost" data-k="x">지우기</button></div>
      <div class="hrow" id="edPmRow" style="margin-top:7px;font-size:13px;color:#536560">그날 할 시간 <input class="inp" type="number" min="1" step="5" id="edPm" style="max-width:90px;flex:none" value="${v.pm}" placeholder="남은 전부">분 <span class="sum">(비우면 남은 시간 전부)</span></div></div>
    <div class="field"><label>메모</label><input class="inp" id="edMemo" value="${esc(v.memo)}" placeholder="예: 남은 시간 채움, 나눠서"></div>
    <div class="mfoot"><button class="danger" id="edDel">삭제</button>${r.nid?`<a class="ghost" target="_blank" rel="noopener" href="https://www.notion.so/${r.nid.replace(/-/g,'')}">노션에서 열기</a>`:''}<button class="ghost" id="edMsg">안내 문구</button><span class="sp"></span><button class="ghost" id="edC">닫기</button><button class="primary" id="edO">저장</button></div>
    <div class="hist" id="edHist">변경 기록 불러오는 중...</div>`);
  function draw(){const i=info({...r,...v,k:v.k||null,d:v.d||null});m.querySelector('#edPill').innerHTML=pill(i)+' '+ddChip(i);
    m.querySelectorAll('#edS button').forEach(b=>b.classList.toggle('on',b.dataset.s===v.s));m.querySelectorAll('#edU button').forEach(b=>b.classList.toggle('on',b.dataset.u===v.sub));
    
    m.querySelector('#edPmRow').classList.toggle('hidden',!(v.k&&v.s!=='완료'&&v.s!=='종료'));
    const lines=[];if(v.d){lines.push(`소멸일 <b>${kdate(i.exp)}</b> (결석일 + ${S.set.expireMonths||2}개월)${i.left>0?` · 앞으로 ${i.left}일`:' · 기한이 지났어요'}`)}
    if((+r.dm||0)>0)lines.push(`보강한 시간 <b>${r.dm}분</b>${rem(r)?` · 남은 시간 <b>${rem(r)}분</b>`:''} (학생 화면의 '보강한 기록'에서 취소할 수 있어요)`);
    const others=S.rows.filter(x=>x.n===v.n&&x.id!==r.id&&OPEN.has(info(x).key));if(others.length)lines.push(`이 학생의 다른 보강 전 기록 ${others.length}건 (${mins(remSum(others))} 남음)`);
    lines.push(r.sync==='pending'?'<span style="color:var(--red)">노션에 아직 못 보냈어요. 저장하면 다시 보내요.</span>':r.nid?'노션과 연결된 기록이에요.':'');
    m.querySelector('#edInfo').innerHTML=lines.filter(Boolean).join('<br>')}
  m.querySelector('#edN').oninput=e=>{v.n=e.target.value;draw()};
  m.querySelector('#edD').onchange=e=>{v.d=e.target.value;draw()};
  m.querySelector('#edM').oninput=e=>{v.m=e.target.value===''?null:+e.target.value;draw()};
    m.querySelector('#edU').onclick=e=>{const b=e.target.closest('button');if(!b)return;v.sub=b.dataset.u;draw()};
  m.querySelector('#edS').onclick=e=>{const b=e.target.closest('button');if(!b)return;v.s=b.dataset.s;if(v.s==='완료'&&!v.k){v.k=today();m.querySelector('#edK').value=v.k}draw()};
  const setK=k=>{v.k=k;m.querySelector('#edK').value=k;if(!k){v.pm='';m.querySelector('#edPm').value=''}if(k&&v.s==='시작 전'&&k>=today())v.s='예약 중';if(!k&&v.s==='예약 중')v.s='시작 전';draw()};
  m.querySelector('#edK').onchange=e=>setK(e.target.value);
  m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>setK(b.dataset.k==='x'?'':addDays(today(),+b.dataset.k)));
  m.querySelector('#edMemo').oninput=e=>{v.memo=e.target.value};
  m.querySelector('#edPm').oninput=e=>{v.pm=e.target.value===''?'':+e.target.value};
  m.querySelector('#edC').onclick=closeModal;
  m.querySelector('#edMsg').onclick=()=>openMsg([{...r,...v,k:v.k||null}]);
  m.querySelector('#edDel').onclick=async()=>{if(!confirm(`${r.n} ${r.d?md(r.d):''} 결석 기록을 지울까요?\n노션에서도 휴지통으로 옮겨져요. (설정 > 지운 기록에서 되살릴 수 있어요)`))return;
    try{await delRow(r.id);closeModal();toast('지웠어요.')}catch(e){toast(errText(e),true)}};
  const save=async(force)=>{const b=m.querySelector('#edO');b.disabled=true;b.textContent='저장하는 중...';
    try{await saveRow({id:r.id,n:v.n,d:v.d,m:v.m,s:v.s,k:v.k,memo:v.memo,pm:(v.k&&v.s!=='완료'&&v.s!=='종료'&&v.pm)?v.pm:'',sub:v.sub,force:!!force});closeModal();toast('저장했어요. 노션에도 반영했어요.')}
    catch(e){if(String(e.message)==='DUP'&&confirm('같은 날 같은 학생의 기록이 이미 있어요. 그래도 저장할까요?'))return save(true);toast(errText(e),true);b.disabled=false;b.textContent='저장'}};
  m.querySelector('#edO').onclick=()=>save(false);
  m.addEventListener('keyup',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.id!=='edN')save(false)});
  draw();
  api('ab_history',{p_token:S.token,p_id:r.id}).then(h=>{const el=m.querySelector('#edHist');if(!el)return;el.innerHTML='<b>변경 기록</b>'+(h||[]).map(x=>`<div>${new Date(x.at).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})} · ${esc(x.w)}</div>`).join('')}).catch(()=>{const el=m.querySelector('#edHist');if(el)el.textContent=''})}

/* 학생 한 명 */
function openStudent(n){S.curStu=n;const st=S.stuMap.get(n);const rs=S.rows.filter(r=>r.n===n).sort((a,b)=>(b.d||'').localeCompare(a.d||''));
  const open=rs.filter(r=>OPEN.has(info(r).key));
  const m=openModal(`<div class="stu-head"><h2 style="margin:0">${esc(n)}</h2>${st?`<span class="pill st-closed">${esc(st.s)}</span><span class="sum">${esc(st.g||'')}</span>`:'<span class="sum">온하이 원생 명단에 없는 이름</span>'}<span class="sp" style="flex:1"></span>
    <button class="primary" style="padding:8px 12px;font-size:13px" data-act="makeupStu" data-n="${esc(n)}">+ 보강 기록</button><button class="outline" id="sAdd">+ 결석 기록</button>${open.length?'<button class="ghost" id="sMsg">안내 문구</button>':''}${st&&st.p?`<a class="ghost" href="../#${esc(st.p)}" target="_blank" rel="noopener">학생일지에서 보기</a>`:''}</div>
    <div class="kv"><div><span>보강 전</span><b style="color:var(--amber)">${open.length}건 · ${splitTxt(open)}</b></div><div><span>전체 결석</span><b>${rs.length}건</b></div><div><span>보강 완료</span><b>${rs.filter(r=>r.s==='완료').length}건</b></div><div><span>소멸</span><b style="color:var(--red)">${rs.filter(isGone).length}건</b></div></div>
    <div class="rows" style="max-height:48vh;overflow:auto">${rs.map(r=>rowLine(r,{noName:true})).join('')||'<div class="empty">결석 기록이 없어요.</div>'}</div>
    ${stuSessions(n)}
    <div class="mfoot"><span class="sp"></span><button class="ghost" id="sC">닫기</button></div>`,'wide');
  m.querySelector('#sC').onclick=closeModal;m.querySelector('#sAdd').onclick=()=>{closeModal();openAdd();setTimeout(()=>{const q=document.querySelector('#amQ');if(q){q.value=n;q.dispatchEvent(new Event('input'));const b=document.querySelector('#amSug [data-add]');if(b)b.click()}},40)};
  const sm=m.querySelector('#sMsg');if(sm)sm.onclick=()=>openMsg(open)}

function stuSessions(n){const gs=new Map();S.allocs.filter(x=>x.n===n).forEach(x=>{if(!gs.has(x.g))gs.set(x.g,{g:x.g,d:x.d,m:0,items:[],memo:x.memo});const o=gs.get(x.g);o.m+=x.m;o.items.push(x)});
  const sess=[...gs.values()].sort((a,b)=>b.d.localeCompare(a.d));if(!sess.length)return '';
  return `<h3 style="font-size:14px;margin:16px 0 2px">보강한 기록 <span class="sum">(앱에서 '보강 기록'으로 남긴 것)</span></h3><div class="rows" style="max-height:22vh;overflow:auto">${sess.map(o=>`<div class="row"><span class="dt">${ymd(o.d)}</span><span class="mn">${o.m}분</span><span class="memo" title="${esc(o.memo)}">${o.items.map(x=>{const r=S.byId.get(x.a);return (r?md(r.d)+' 결석분 ':'')+x.m+'분'}).join(', ')}${o.memo?' · '+esc(o.memo):''}</span><span class="acts"><button class="mini" data-act="mkCancel" data-g="${o.g}" data-n="${esc(n)}">취소</button></span></div>`).join('')}</div>`}

/* 보강 기록: 보강한 시간을 오래된 결석부터 채움 (일부 보강, 여러 결석 한 번에) */
function openMakeup(n,preIds,back,opts){
  let sub=(opts&&opts.sub)||((preIds&&preIds[0]&&S.byId.get(preIds[0]))?subOf(S.byId.get(preIds[0])):'리드인');
  let name=n||'',d=(opts&&opts.date)||today(),touched=false,mval=null,showExp=false;let checked=new Set(preIds||[]);let firstDraw=true;
  const m=openModal(`<h2>보강 기록</h2><div class="sub">보강한 시간을 적으면 체크한 결석을 위에서부터(오래된 것부터) 채워요. 다 채운 결석은 '완료', 덜 채운 결석은 남은 시간만 줄어요.</div>
    <div class="grid2" style="gap:10px"><div class="field"><label>학생</label><input class="inp" id="mkN" value="${esc(name)}" placeholder="이름 (초성 가능)" autocomplete="off" spellcheck="false"><div class="sug" id="mkSug"></div></div>
    <div class="field"><label>보강한 날짜</label><div class="hrow"><input class="inp" type="date" id="mkD" value="${d}"><button class="ghost" data-q="0">오늘</button><button class="ghost" data-q="-1">어제</button></div></div></div>
    <div class="field"><label>수업</label><div class="seg" id="mkU">${SUBS.map(s=>`<button data-u="${s}">${s}</button>`).join('')}</div></div>
    <div class="field"><label>보강한 시간(분)</label><div class="hrow"><input class="inp" style="max-width:110px" type="number" min="1" step="5" id="mkM">분 <span class="sum" id="mkAll"></span></div></div>
    <div class="field"><label>채울 결석 <span style="font-weight:600;color:var(--muted)">(체크한 것만, 위에서부터 채워요)</span> <label style="float:right;font-weight:600;color:var(--muted);cursor:pointer"><input type="checkbox" id="mkExp"> 소멸된 결석도 보기</label></label><div class="rows" id="mkList"></div></div>
    <div class="field"><label>메모 (선택)</label><input class="inp" id="mkMemo" placeholder="예: 10분씩 3번 빠진 것 한 번에"></div>
    <div class="info" id="mkPrev"></div>
    <div class="mfoot"><span class="sp"></span><button class="ghost" id="mkC">취소</button><button class="primary" id="mkO">보강 기록하기</button></div>`,'wide');
  const list=()=>S.rows.filter(r=>r.n===name&&subOf(r)===sub&&(OPEN.has(info(r).key)||(showExp&&info(r).key==='expired'))&&rem(r)>0).sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  const sel=()=>list().filter(r=>checked.has(r.id));
  function allocPlan(){let left=+mval||0;const out=new Map();for(const r of sel()){const rm=rem(r);const use=Math.min(rm,left);left-=use;out.set(r.id,{use,rest:rm-use})}return {out,left}}
  function draw(){
    m.querySelectorAll('#mkU button').forEach(b=>b.classList.toggle('on',b.dataset.u===sub));
    const L=list();if(firstDraw&&!preIds){const tb=L.filter(r=>r.k&&r.k<=d&&r.k>=addDays(d,-7)&&OPEN.has(info(r).key));(tb.length?tb:L.filter(r=>OPEN.has(info(r).key))).forEach(r=>checked.add(r.id))}firstDraw=false;
    if(!touched){mval=sel().reduce((a,r)=>a+(r.k?plan(r):rem(r)),0)||null;m.querySelector('#mkM').value=mval??''}
    const all=remSum(sel());
    m.querySelector('#mkAll').textContent=all?`남은 시간 모두 ${all}분`:'';
    const p=allocPlan();
    m.querySelector('#mkList').innerHTML=!name?'<div class="empty">학생을 먼저 골라 주세요.</div>':L.map(r=>{const i=info(r),x=p.out.get(r.id);
      return `<div class="row"><input type="checkbox" class="cbx" data-ck="${r.id}" ${checked.has(r.id)?'checked':''}><span class="dt">${ymd(r.d)}</span><span class="mn">${r.m}분</span>${(+r.dm||0)>0?`<span class="dd part">${r.dm}분 함 · ${rem(r)}분 남음</span>`:''}${pill(i)} ${ddChip(i)}
        <span style="margin-left:auto;font-weight:800;font-size:12.5px;color:${x&&x.use?(x.rest?'var(--blue)':'#1d7a4a'):'#b0bbb7'}">${x&&x.use?(x.rest?`→ ${x.use}분 채움 (${x.rest}분 남음)`:`→ ${x.use}분 채움 · 완료`):(checked.has(r.id)?'→ 시간이 모자라요':'')}</span></div>`}).join('')||'<div class="empty">보강할 결석이 없어요.</div>';
    const done=[...p.out.values()].filter(x=>x.use&&!x.rest).length,part=[...p.out.values()].filter(x=>x.use&&x.rest).length;
    m.querySelector('#mkPrev').innerHTML=name&&+mval?`<b>${esc(name)}</b> ${kdate(d)} 보강 ${mins(+mval)} → 완료 ${done}건${part?`, 일부 보강 ${part}건`:''}${p.left>0?` · <span style="color:var(--red)">남는 ${p.left}분은 채울 결석이 없어 기록되지 않아요</span>`:''}`:'학생, 날짜, 보강한 시간을 넣어 주세요.';
    const b=m.querySelector('#mkO');b.disabled=!(name&&+mval>0&&(done+part)>0)}
  function sug(){const v=m.querySelector('#mkN').value.trim();const el=m.querySelector('#mkSug');if(!v||v===name){el.innerHTML='';return}
    const owe=new Map();S.rows.forEach(r=>{if(OPEN.has(info(r).key)&&rem(r)>0)owe.set(r.n,(owe.get(r.n)||0)+rem(r))});
    const c=[...owe.keys()].filter(x=>match(x,v)).sort((a,b)=>a.localeCompare(b)).slice(0,10);
    el.innerHTML=c.map(x=>`<button class="chip" data-pickn="${esc(x)}">${esc(x)} · ${mins(owe.get(x))}</button>`).join('')||'<span class="sum">보강할 결석이 있는 학생 중에 없어요.</span>'}
  function setName(x){name=x;m.querySelector('#mkN').value=x;checked=new Set();firstDraw=true;preIds=null;touched=false;sug();draw()}
  m.querySelector('#mkN').addEventListener('input',e=>{const v=e.target.value.trim();if(S.rows.some(r=>r.n===v)&&v!==name){setName(v);return}if(v!==name){name='';checked=new Set();draw()}sug()});
  m.querySelector('#mkN').addEventListener('keyup',e=>{if(e.key==='Enter'){sug();const f=m.querySelector('#mkSug [data-pickn]');if(f)setName(f.dataset.pickn)}});
  m.querySelector('#mkD').onchange=e=>{d=e.target.value;draw()};
  m.querySelector('#mkM').oninput=e=>{touched=true;mval=e.target.value===''?null:+e.target.value;draw()};
  m.querySelector('#mkExp').onchange=e=>{showExp=e.target.checked;draw()};
  m.addEventListener('click',e=>{const t=e.target;
    if(t.dataset&&t.dataset.ck){if(t.checked)checked.add(t.dataset.ck);else checked.delete(t.dataset.ck);draw();return}
    const b=t.closest('button');if(!b)return;
    if(b.dataset.q!=null){d=addDays(today(),+b.dataset.q);m.querySelector('#mkD').value=d;draw()}
    else if(b.dataset.m!=null){touched=true;mval=+b.dataset.m;m.querySelector('#mkM').value=mval;draw()}
    else if(b.dataset.pickn!=null)setName(b.dataset.pickn)
    else if(b.dataset.u!=null){sub=b.dataset.u;checked=new Set();firstDraw=true;preIds=null;touched=false;draw()}});
  m.querySelector('#mkC').onclick=()=>{closeModal();if(back)openStudent(back)};

function checkOnhi(){const h=location.hash;if(!h.startsWith('#onhi='))return;let p=null;try{p=JSON.parse(decodeURIComponent(h.slice(6)))}catch(e){}

  const per=new Map();at.filter(a=>a[6]==='1'&&a[5]!=null).forEach(a=>{const o=per.get(a[0])||{n:a[0],sm:0,dur:0,t:[]};o.sm+=a[2];o.dur+=a[5];o.t.push(`${a[1]} 수업 · 등원 ${a[3]} 하원 ${a[4]} (${a[5]}분)`);per.set(a[0],o)});

  shorts.sort((a,b)=>a.n.localeCompare(b.n));overs.sort((a,b)=>a.n.localeCompare(b.n));
  const noTime=[...new Set(at.filter(a=>a[6]==='1'&&a[5]==null).map(a=>a[0]))];

  const m=openModal(`<h2>온하이에서 가져오기</h2><div class="sub">${kdate(d)} 온하이 일별출석부${p.cnt?` · 전체 ${p.cnt.t}명, 출석 ${p.cnt.y}, 결석 ${p.cnt.n}, 보강 ${p.cnt.b}`:''}. 체크한 것만 기록해요. 노션 비고는 비워 둬요.</div>

    <h3 style="font-size:14px;margin:14px 0 2px">더 하고 간 학생 ${overs.length}명 <span class="sum">(${dMin}분 이상 더 함 → 그 학생의 가장 오래된 못 한 시간에서 빼요)</span></h3><div class="rows" id="ohV"></div>

  function draw(){

      ${x.ex?`<span class="pill st-closed">이미 기록됨 (${x.ex.m}분)</span>`:'<span class="pill st-wait">새로 기록</span>'}${x.known?'':' <span class="dd soon">온하이에 없는 이름</span>'}</div>`).join('')||'<div class="empty">이날 결석이 없어요.</div>';

    m.querySelector('#ohS').innerHTML=shorts.map((x,i)=>`<div class="row"><input type="checkbox" class="cbx" data-ss="${i}" ${x.on?'checked':''} ${x.ex?'disabled':''}><span class="nm">${esc(x.n)}</span><input class="inp" type="number" min="0" data-ssm="${i}" value="${x.m}" style="width:70px;text-align:right" ${x.ex?'disabled':''}>분<span class="sum">${x.t.map(esc).join(' / ')}</span>${x.ex?'<span class="pill st-closed">이날 기록 이미 있음</span>':'<span class="pill st-wait">수업 덜 함</span>'}</div>`).join('')||'<div class="empty">없어요.</div>';
    m.querySelector('#ohV').innerHTML=overs.map((x,i)=>{const owe=remSum(x.open);return `<div class="row"><input type="checkbox" class="cbx" data-vv="${i}" ${x.on?'checked':''} ${x.done||!x.open.length?'disabled':''}><span class="nm">${esc(x.n)}</span><input class="inp" type="number" min="0" data-vvm="${i}" value="${x.m}" style="width:70px;text-align:right" ${x.done||!x.open.length?'disabled':''}>분<span class="sum">${x.t.map(esc).join(' / ')}</span>${x.done?'<span class="pill st-done">이날 이미 뺐음</span>':!x.open.length?'<span class="pill st-closed">뺄 못 한 시간 없음</span>':`<span class="pill st-booked">못 한 시간 ${owe}분에서 빼기</span>`}${x.sameDay&&!x.done?' <span class="dd soon" title="이날 이미 보강 기록이 있어요. 더 한 시간이 그 보강이면 체크하지 마세요">이날 보강 기록 있음</span>':''}</div>`}).join('')||'<div class="empty">없어요.</div>';
    const na=ab.filter(x=>x.on&&!x.ex).length,nm=mk.filter(x=>x.on&&!x.done&&x.open.length).length,ns=shorts.filter(x=>x.on&&!x.ex).length,nv=overs.filter(x=>x.on&&!x.done&&x.open.length).length;
    m.querySelector('#ohSum').textContent=`결석 ${na} · 덜 함 ${ns} · 더 함 ${nv} · 보강 ${nm}명 기록`;m.querySelector('#ohO').disabled=!(na+nm+ns+nv)}
