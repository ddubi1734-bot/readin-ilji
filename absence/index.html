/* 학부모 안내 문구 */
function msgFor(list){list=list.slice().sort((a,b)=>(a.d||'').localeCompare(b.d||''));const byN=new Map();list.forEach(r=>{if(!byN.has(r.n))byN.set(r.n,[]);byN.get(r.n).push(r)});
  const out=[];for(const [n,rs] of byN){const nm=n.replace(/\(\d+\)$/,'');
    const booked=rs.filter(r=>r.k&&r.s!=='완료'),wait=rs.filter(r=>!r.k&&r.s!=='완료'),done=rs.filter(r=>r.s==='완료');
    const lines=[`안녕하세요, 리드인 황남1점입니다.`];
    if(booked.length){const g=new Map();booked.forEach(r=>{if(!g.has(r.k))g.set(r.k,[]);g.get(r.k).push(r)});
      for(const [k,x] of g)lines.push(`${nm} 학생 ${x.map(r=>kdate(r.d)).join(', ')} 결석분 보강(${mins(x.reduce((a,r)=>a+plan(r),0))})을 ${kdate(k)}에 진행할 예정입니다.`)}
    if(wait.length){const exp=wait.map(r=>info(r).exp).filter(x=>x&&x>=today()).sort()[0];
      lines.push(`${nm} 학생 ${wait.map(r=>kdate(r.d)).join(', ')} 결석분 중 ${mins(remSum(wait))} 보강이 남아 있습니다. 가능하신 날짜를 알려 주시면 보강 일정을 잡아 드리겠습니다.`);
      if(exp)lines.push(`(보강은 결석일로부터 ${S.set.expireMonths||2}개월 안에 가능하며, 가장 빠른 기한은 ${kdate(exp)}입니다.)`)}
    if(done.length&&!booked.length&&!wait.length)lines.push(`${nm} 학생 ${done.map(r=>kdate(r.d)).join(', ')} 결석분 보강을 ${[...new Set(done.map(r=>r.k).filter(Boolean))].map(kdate).join(', ')||'모두'} 마쳤습니다.`);
    lines.push('감사합니다.');out.push(lines.join('\n'))}
  return out.join('\n\n')}
function openMsg(list){const m=openModal(`<h2>학부모 안내 문구</h2><div class="sub">고칠 부분은 고친 뒤 복사해서 문자·카톡에 붙여 넣으세요.</div>
  <textarea class="inp" id="msgT">${esc(msgFor(list))}</textarea><div class="mfoot"><span class="sp"></span><button class="ghost" id="mC">닫기</button><button class="primary" id="mO">복사하기</button></div>`);
  m.querySelector('#mC').onclick=closeModal;m.querySelector('#mO').onclick=async()=>{const t=m.querySelector('#msgT');try{await navigator.clipboard.writeText(t.value)}catch(e){t.select();document.execCommand('copy')}toast('복사했어요.')}}

  <div class="field"><label>덜 함·더 함 기준 (온하이 등·하원)</label><div class="hrow">수업 시간과 <input class="inp" type="number" min="1" max="60" id="stD" value="${S.set.diffMin||5}" style="max-width:70px">분 이상 차이 날 때만 <button class="outline" id="stDS">저장</button></div></div>
  <div class="field"><label>노션 백업</label><div class="hrow"><button class="outline" id="stPush">못 보낸 기록 다시 보내기</button><a class="ghost" target="_blank" rel="noopener" href="${esc(S.set.dbUrl||'https://www.notion.so')}">노션 결석 캘린더 열기</a></div>
   <div class="sum" style="margin-top:4px">앱이 원본이고, 앱에서 바꾼 것은 노션 결석 캘린더에 바로 백업돼요. 노션에서 고친 것은 앱에 들어오지 않아요.</div>
   <details class="more" style="margin-top:6px"><summary>노션 백업에서 되살리기 (비상용)</summary><div class="sum" style="margin:6px 0">앱 서버 기록이 사라졌을 때만 쓰세요. 노션 내용으로 앱 기록을 덮어써요.</div><button class="danger" id="stPull">노션 백업에서 되살리기</button></details></div>
  <div class="field"><label>온하이 연동</label><div class="sum">온하이 일별출석부 왼쪽 아래 "결석·보강 캘린더로 보내기" 버튼(확장 프로그램)을 쓰세요. 결석·보강·덜 함·더 함이 미리보기로 열려요.</div></div>
  <div class="field"><label>지운 기록</label><div id="stTrash" class="rows"><button class="ghost" id="stTL">최근 지운 기록 보기</button></div></div>
  <div class="field"><label>내보내기</label><button class="ghost" id="stCsv">전체 기록 엑셀(CSV)로 받기</button></div>
  <div class="mfoot"><span class="sp"></span><button class="ghost" id="stC">닫기</button></div>`);
  m.querySelector('#stC').onclick=closeModal;m.querySelector('#stCsv').onclick=csv;
  m.querySelector('#stDS').onclick=async()=>{try{S.set=await api('ab_set_setting',{p_token:S.token,p_key:'diff_min',p_value:String(m.querySelector('#stD').value)});toast('저장했어요.')}catch(e){toast(errText(e),true)}};
  m.querySelector('#stES').onclick=async()=>{try{S.set=await api('ab_set_setting',{p_token:S.token,p_key:'expire_months',p_value:String(m.querySelector('#stE').value)});render();toast('저장했어요.')}catch(e){toast(errText(e),true)}};
  m.querySelector('#stPush').onclick=()=>pushPending(false);
  m.querySelector('#stPull').onclick=async e=>{if(!confirm('노션 백업 내용으로 앱 기록을 덮어쓸까요? 앱 서버 기록이 사라졌을 때만 쓰세요.'))return;e.target.disabled=true;e.target.textContent='되살리는 중... (10초쯤 걸려요)';await pull(true);e.target.disabled=false;e.target.textContent='노션 백업에서 되살리기'};
  m.querySelector('#stTL').onclick=async()=>{const el=m.querySelector('#stTrash');el.innerHTML='불러오는 중...';try{const t=await api('ab_trash',{p_token:S.token});
    el.innerHTML=t.map(r=>`<div class="row"><span class="nm">${esc(r.n||'(이름 없음)')}</span><span>${r.d?ymd(r.d):'날짜 없음'}</span><span class="mn">${r.m!=null?r.m+'분':''}</span><span class="acts"><button class="mini g" data-restore="${r.id}">되살리기</button></span></div>`).join('')||'<div class="empty">지운 기록이 없어요.</div>';
    el.querySelectorAll('[data-restore]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const x=await api('ab_restore',{p_token:S.token,p_id:b.dataset.restore});upsertLocal(x.row);afterSync(x.synced);render();b.textContent='되살림';toast('되살렸어요. 노션에도 다시 넣었어요.')}catch(er){toast(errText(er),true);b.disabled=false}})}catch(e){el.textContent=errText(e)}}}

function csv(){const head=['이름','수업','결석일','요일','빠진 시간(분)','보강한 시간(분)','남은 시간(분)','보강 여부','보강일','메모','소멸일','앱 분류'];
  const rows=S.rows.slice().sort((a,b)=>(a.d||'').localeCompare(b.d||'')||a.n.localeCompare(b.n)).map(r=>{const i=info(r);return [r.n,subOf(r),r.d||'',r.d?dow(r.d):'',r.m??'',r.dm||'',rem(r),r.s,r.k||'',r.memo||'',i.exp||'',i.label]});
  const q=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const blob=new Blob(['\ufeff'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`결석캘린더_${today()}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* ---------- 이벤트 ---------- */
document.addEventListener('click',async e=>{
  const tb=e.target.closest('[data-tab]');if(tb&&!e.target.closest('.modal')){setTab(tb.dataset.tab);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='pick'){e.stopPropagation();if(el.checked)S.picked.add(id);else S.picked.delete(id);renderBulk();return}
  if(a==='pickGroup'){const rs=pendRows().filter(r=>r.n===el.dataset.n);rs.forEach(r=>el.checked?S.picked.add(r.id):S.picked.delete(r.id));refreshBody();return}
  if(a==='dayAdd'){if(e.target.closest('.ev')||e.target.closest('.ln'))return;openDayMenu(el.dataset.d);return}
  e.stopPropagation();
  const stuCtx=el.closest('.modal')&&S.curStu&&$('modalRoot').querySelector('.stu-head')?S.curStu:null;
  try{
    if(a==='add')openAdd();
    else if(a==='edit')openEdit(id);
    else if(a==='makeup'){const r=S.byId.get(id);openMakeup(r.n,[id],stuCtx)}
    else if(a==='makeupStu')openMakeup(el.dataset.n||'',null,stuCtx||(el.closest('.modal')?el.dataset.n:null))
    else if(a==='mkCancel'){const g=el.dataset.g;const items=S.allocs.filter(x=>x.g===g);if(!confirm(`${ymd(items[0].d)} 보강 ${items.reduce((s,x)=>s+x.m,0)}분 기록을 취소할까요? 채웠던 결석의 남은 시간이 되돌아가요.`))return;
      const x=await api('ab_makeup_cancel',{p_token:S.token,p_grp:g});(x.rows||[]).forEach(upsertLocal);S.allocs=S.allocs.filter(y=>y.g!==g);render();openStudent(el.dataset.n);toast('보강 기록을 취소했어요.')}
    else if(a==='student')openStudent(el.dataset.n);
    else if(a==='msg')openMsg(pendRows().filter(r=>r.n===el.dataset.n));
    else if(a==='book'){const r=S.byId.get(id);const b=await askBook(r);if(!b)return;
      const x=await api('ab_book',{p_token:S.token,p_id:id,p_day:b.k,p_min:b.pm});upsertLocal(x.row);afterSync(x.synced);render();if(stuCtx)openStudent(stuCtx);toast(`${r.n} ${md(b.k)} ${plan(x.row)}분 보강으로 예약했어요.`)}
    else if(a==='complete'){const r=S.byId.get(id);const k=await askDate('보강 완료',`${r.n} ${mdw(r.d)} 결석분 ${r.m!=null?r.m+'분':''} 보강한 날짜예요.`,r.k&&r.k<=today()?r.k:today(),'완료 처리');if(!k)return;
      await setStatus(id,'완료',k);render();if(stuCtx)openStudent(stuCtx);toast(`${r.n} 보강 완료로 바꿨어요.`)}
    else if(a==='reopen'){const r=S.byId.get(id);if(!confirm(`${r.n} ${md(r.d)} 기록을 다시 '보강 전'으로 돌릴까요? (보강 날짜와 보강한 시간도 지워져요)`))return;
      const x=await api('ab_reopen',{p_token:S.token,p_id:id});upsertLocal(x.row);S.allocs=x.allocs||S.allocs;afterSync(x.synced);render();if(stuCtx)openStudent(stuCtx);toast('보강 전으로 돌렸어요.')}
    else if(a==='calMove'){const v=+el.dataset.v;if(v===0){const t=today();S.calY=+t.slice(0,4);S.calM=+t.slice(5,7)}else{let m=S.calM+v,y=S.calY;if(m<1){m=12;y--}if(m>12){m=1;y++}S.calY=y;S.calM=m}render()}
    else if(a==='pf'){S.pf=el.dataset.v;S.picked.clear();render()}
    else if(a==='pt'){S.pt=el.dataset.v;S.picked.clear();render()}
    else if(a==='cv'){const cv=cvGet();cv[el.dataset.v]=!cv[el.dataset.v];ls.set('absence.cv.v1',JSON.stringify(cv));render()}
    else if(a==='closeOne'){const r=S.byId.get(id);if(!confirm(`${r.n} ${md(r.d)} 소멸 기록을 지울까요?`))return;await closeGone([id])}
    else if(a==='closePicked'){const ids=[...S.picked];if(!confirm(`선택한 ${ids.length}건을 지울까요?`))return;await closeGone(ids)}
    else if(a==='closeAll'){const q=S.eq.trim();const ids=rowsBy(r=>info(r).key==='expired'&&match(r.n,q)).map(r=>r.id);if(!confirm(`소멸된 ${ids.length}건을 모두 지울까요? 노션 백업에서도 휴지통으로 옮겨져요.`))return;await closeGone(ids)}
    else if(a==='pg'){S.pg=!S.pg;savePref();render()}
    else if(a==='sfilter'){S.sfilter=el.dataset.v;render()}
    else if(a==='ssort'){S.ssort=el.dataset.v;render()}
    else if(a==='goSoon'){S.tab='pend';S.pf='soon';savePref();render()}
    else if(a==='goCheck'){S.tab='pend';S.pf='check';savePref();render()}
    else if(a==='showNodate')openNodate();
    else if(a==='csv')csv();
    else if(a==='bulkBook')bulk('예약 중');
    else if(a==='bulkDone'){const rs=[...S.picked].map(x=>S.byId.get(x)).filter(Boolean);const ns=[...new Set(rs.map(r=>r.n))];if(ns.length===1)openMakeup(ns[0],rs.map(r=>r.id));else bulkMakeup(rs)}
    else if(a==='bulkMsg')openMsg([...S.picked].map(x=>S.byId.get(x)).filter(Boolean));
    else if(a==='bulkClear'){S.picked.clear();render()}
  }catch(er){toast(errText(er),true)}
});
function refreshBody(){const f={home:vHome,cal:vCal,pend:vPend,done:vDone,exp:vExp,stu:vStu,stat:vStat}[S.tab];const tpl=document.createElement('div');tpl.innerHTML=f(counts());
  const nb=tpl.querySelector('#vbody'),ob=$('vbody');if(nb&&ob)ob.innerHTML=nb.innerHTML;else render();renderBulk()}
document.addEventListener('input',e=>{const id=e.target.id;const map={calQ:'calQ',pq:'pq',dq:'dq',eq:'eq',sq:'sq'};if(!map[id])return;S[map[id]]=e.target.value;refreshBody()});
document.addEventListener('change',e=>{if(e.target.id==='showMk'){S.showMk=e.target.checked;savePref();render()}else if(e.target.id==='dm'){S.dm=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modalRoot').firstChild){closeModal();return}
  if(!$('modalRoot').firstChild&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&S.token){if(e.key==='n'||e.key==='ㅜ'){e.preventDefault();openAdd()}}});
$('btnLogin').onclick=login;$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
$('btnLogout').onclick=()=>{if(confirm('로그아웃할까요? (학생일지 앱도 같이 로그아웃돼요)'))logout()};
$('btnSettings').onclick=openSettings;
$('brandHome').onclick=()=>setTab('home');
$('syncPill').onclick=()=>pushPending(false);
setInterval(()=>{if(S.token)syncPill()},30*1000);
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#onhi='))checkOnhi()});
(async()=>{if(!S.token){show('login');checkOnhi();return}await load();checkOnhi();if(S.pending>0)pushPending(true)})();
</script>
